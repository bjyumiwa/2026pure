<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>WAIE Speech Practice v2</title>
  <style>
    :root {
      --bg: #fff7fb;
      --panel: #ffffff;
      --ink: #2b2430;
      --muted: #736673;
      --accent: #d84f93;
      --accent2: #7062d9;
      --ok: #1f7a55;
      --warn: #a16100;
      --stop: #403648;
      --border: #eaddea;
      --soft: #fff0f7;
      --shadow: 0 10px 25px rgba(77, 42, 74, .13);
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      overflow: hidden;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--ink);
      background: linear-gradient(135deg, #fff7fb 0%, #f7f5ff 100%);
    }
    .app {
      height: 100dvh;
      display: grid;
      grid-template-columns: 168px minmax(0, 1.24fr) minmax(420px, .9fr);
      gap: 8px;
      padding: 8px;
    }
    .panel {
      background: rgba(255,255,255,.96);
      border: 1px solid var(--border);
      border-radius: 18px;
      box-shadow: var(--shadow);
      overflow: hidden;
      min-height: 0;
    }
    .nav { display:flex; flex-direction:column; }
    .brand { padding: 8px 9px 6px; border-bottom: 1px solid var(--border); }
    h1 { margin:0; font-size: 15px; line-height:1.2; }
    .hint { margin:4px 0 0; color:var(--muted); font-size:10.5px; line-height:1.35; }
    .navTools { display:grid; grid-template-columns:1fr 1fr; gap:5px; padding:6px; border-bottom:1px solid var(--border); }
    .navList { overflow:auto; padding: 6px; min-height:0; }
    .navItem { display:grid; grid-template-columns: 1fr 24px 24px; gap:3px; margin-bottom:4px; }
    .navSelect, .miniBtn, button, .pillBtn {
      border: 1px solid var(--border);
      border-radius: 9px;
      background: #fff;
      color: var(--ink);
      cursor: pointer;
      font-family: inherit;
    }
    .navSelect {
      min-height: 32px;
      text-align:left;
      padding: 5px 6px;
      font-size: 11px;
      line-height: 1.15;
      overflow:hidden;
    }
    .navTitle { display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .navItem.active .navSelect { border-color: var(--accent); background: var(--soft); font-weight:800; }
    .miniBtn { min-height: 28px; padding:0; font-size:12px; font-weight:800; }
    .miniBtn:disabled, button:disabled { opacity:.36; cursor:not-allowed; }

    .slidePanel { display:flex; flex-direction:column; min-width:0; }
    .topbar {
      height: 44px;
      flex: 0 0 auto;
      padding: 6px 8px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:8px;
      border-bottom:1px solid var(--border);
    }
    .slideTitle { font-weight:900; font-size: 14px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .slideNo { color:var(--muted); font-size:11px; white-space:nowrap; }
    .slideImgArea {
      flex: 1 1 auto;
      min-height:0;
      padding: 8px;
      display:grid;
      place-items:center;
      background:#fffafd;
    }
    .slideFrame {
      width:100%;
      height:100%;
      display:grid;
      place-items:center;
      border-radius: 14px;
      border:1px solid var(--border);
      background:#fff;
      overflow:hidden;
    }
    #slideImage { width:100%; height:100%; object-fit:contain; background:#fff; }

    .scriptPanel { display:flex; flex-direction:column; min-width:0; }
    .scriptTop {
      flex:0 0 auto;
      padding:6px 8px;
      border-bottom:1px solid var(--border);
      display:grid;
      grid-template-columns: 1fr;
      gap:6px;
      align-items:center;
    }
    .btnRow { display:flex; gap:5px; flex-wrap:wrap; align-items:center; }
    button {
      min-height: 28px;
      padding: 5px 8px;
      font-size: 11.5px;
      font-weight:800;
      line-height:1;
    }
    button.primary { background:var(--accent); color:#fff; border-color:transparent; }
    button.secondary { background:var(--accent2); color:#fff; border-color:transparent; }
    button.ok { background:var(--ok); color:#fff; border-color:transparent; }
    button.warn { background:var(--warn); color:#fff; border-color:transparent; }
    button.stop { background:var(--stop); color:#fff; border-color:transparent; }
    label {
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:6px;
      margin:0;
      padding: 6px 8px 4px;
      font-weight:900;
      font-size:12px;
      color:var(--ink);
    }
    textarea {
      width: calc(100% - 16px);
      margin: 0 8px;
      border:1px solid var(--border);
      border-radius:12px;
      padding:9px 10px;
      resize:none;
      font-family: inherit;
      color:var(--ink);
      background:#fff;
      line-height:1.55;
      outline:none;
    }
    #enText {
      flex: 1 1 auto;
      min-height: 230px;
      font-size: 17px;
    }
    #jaText {
      flex: 0 0 128px;
      font-size: 13px;
      background:#fffafd;
    }
    .voiceSettings, .translateSettings {
      flex:0 0 auto;
      display:grid;
      grid-template-columns: 1fr 1fr;
      gap:5px;
      padding:6px 8px;
      border-top:1px solid var(--border);
    }
    .translateSettings { grid-template-columns: 1fr auto; background:#fffafd; }
    select, input[type="range"], input[type="url"] { width:100%; font-size:11px; }
    input[type="url"] { border:1px solid var(--border); border-radius:8px; padding:5px 7px; min-height:28px; }
    .checkLabel { padding:0; font-size:11px; font-weight:700; justify-content:flex-start; }
    .tiny { color:var(--muted); font-size:10.5px; line-height:1.25; }
    .status {
      flex:0 0 auto;
      margin: 0 8px 7px;
      padding: 6px 8px;
      border-radius: 10px;
      background:#f7f4ff;
      color:#4a3e65;
      font-size:11.5px;
      line-height:1.35;
      min-height: 42px;
      white-space:pre-wrap;
    }
    .saveStatus {
      padding: 5px 8px;
      margin: 0 8px 6px;
      border-radius: 10px;
      background:#effaf4;
      color:#29563f;
      font-size:10.8px;
      line-height:1.25;
      border:1px solid #d7efdf;
    }
    .fileInput { display:none; }
    @media (max-width: 980px) {
      body { overflow:auto; }
      .app { height:auto; min-height:100dvh; grid-template-columns:1fr; }
      .navList { max-height:170px; }
      .slideFrame { aspect-ratio:16/9; height:auto; }
      #enText { min-height:220px; }
    }
  </style>
</head>
<body>
  <main class="app">
    <nav class="panel nav">
      <div class="brand">
        <h1>WAIE Practice v2</h1>
        <p class="hint">自動保存を強化。音声入力と英訳補助を追加しました。</p>
      </div>
      <div class="navTools">
        <button id="resetBtn">初期化</button>
        <button id="exportBtn">書出</button>
        <button id="importBtn">読込</button>
        <button id="connectFileBtn">保存接続</button>
        <input type="file" id="importFile" class="fileInput" accept="application/json,.json" />
      </div>
      <div id="slideNav" class="navList"></div>
    </nav>

    <section class="panel slidePanel">
      <div class="topbar">
        <div>
          <div class="slideTitle" id="slideTitle"></div>
          <div class="slideNo" id="slideNo"></div>
        </div>
        <div class="btnRow">
          <button id="moveUpMain">↑上へ</button>
          <button id="moveDownMain">↓下へ</button>
        </div>
      </div>
      <div class="slideImgArea">
        <div class="slideFrame"><img id="slideImage" alt="slide" /></div>
      </div>
    </section>

    <section class="panel scriptPanel">
      <div class="scriptTop">
        <div class="tiny">PCのChrome / Edge向け。編集内容はブラウザ内に保存し、必要に応じてJSONファイルにも保存できます。</div>
        <div class="btnRow">
          <button class="secondary" id="testBtn">音声テスト</button>
          <button class="stop" id="stopBtnTop">停止</button>
          <button class="ok" id="saveNowBtn">今すぐ保存</button>
        </div>
      </div>
      <div class="saveStatus" id="saveStatus">保存準備中です。</div>

      <label for="enText">English narration <span class="tiny">編集すると自動保存</span></label>
      <textarea id="enText" spellcheck="false"></textarea>
      <div class="btnRow" style="padding:6px 8px 2px;">
        <button class="primary" id="speakEnBtn">Englishを読む</button>
        <button class="stop" id="stopBtn1">停止</button>
        <button id="copyEnBtn">Englishコピー</button>
      </div>

      <label for="jaText">日本語メモ <span class="tiny">音声入力→英訳も可</span></label>
      <textarea id="jaText" spellcheck="false"></textarea>
      <div class="btnRow" style="padding:6px 8px 2px;">
        <button class="secondary" id="speakJaBtn">日本語を読む</button>
        <button class="warn" id="dictateBtn">日本語音声入力</button>
        <button class="ok" id="translateBtn">英訳→English欄</button>
        <button class="stop" id="stopBtn2">停止</button>
        <label class="checkLabel"><input id="replaceEnglish" type="checkbox" checked /> 英語欄を上書き</label>
      </div>

      <div class="translateSettings">
        <div>
          <div class="tiny">翻訳API URL（任意。Google Apps Script等）</div>
          <input id="translationEndpoint" type="url" placeholder="https://script.google.com/macros/s/.../exec" />
        </div>
        <button id="saveSettingsBtn">設定保存</button>
      </div>

      <div class="voiceSettings">
        <div>
          <div class="tiny">English voice</div>
          <select id="enVoice"></select>
        </div>
        <div>
          <div class="tiny">日本語 voice</div>
          <select id="jaVoice"></select>
        </div>
        <div>
          <div class="tiny">Speed <span id="rateView">0.78</span></div>
          <input id="rate" type="range" min="0.55" max="1.05" step="0.01" value="0.78" />
        </div>
        <div>
          <div class="tiny">Pitch <span id="pitchView">1.00</span></div>
          <input id="pitch" type="range" min="0.75" max="1.25" step="0.01" value="1.00" />
        </div>
      </div>
      <div class="status" id="status">準備中です。まず「音声テスト」を押して音が出るか確認してください。</div>
    </section>
  </main>

<script>
const DEFAULT_SLIDES = [
  {
    "no": 1,
    "title": "Opening / Title",
    "image": "slides/slide-01.png",
    "english": "Hello everyone. My name is ○○. Thank you very much for joining my presentation. Today, I will present my study: Process-Trace Analysis of Iterative Decision-Making in Generative AI-Supported Art Education. The main message is this: non-selected images are learning traces. In this talk, I focus on the decisions that happen before the final image. I hope you enjoy the presentation.",
    "japanese": "最初のあいさつ用コメントです。みなさん、こんにちは。発表を聞いてくださりありがとうございます。今日は、生成AIを用いた美術教育における反復的な意思決定のプロセスを分析した研究について発表します。中心メッセージは、選ばれなかった画像も学びの記録である、ということです。",
    "id": "slide-01"
  },
  {
    "no": 2,
    "title": "ART 5.0",
    "image": "slides/slide-02.png",
    "english": "The first framework is ART five point zero. I use ART five point zero to position generative AI as one art tool in a long history of tools. Art has always changed with tools, such as brushes, cameras, digital tools, and now AI. In this view, AI is not a replacement for creativity. It is a new tool that changes the process of expression.",
    "japanese": "ART 5.0の説明です。ここでは、生成AIを、筆、カメラ、デジタルツールに続く表現の道具として位置づけます。AIは創造性を置き換えるものではなく、表現の過程を変える新しい道具として説明します。",
    "id": "slide-02"
  },
  {
    "no": 3,
    "title": "Research inspiration",
    "image": "slides/slide-03.png",
    "english": "This research began with one unused image. In a generative AI activity, students often receive many images very quickly. I became interested not only in the image they finally chose, but also in the image they did not choose. So my first question was simple: why was this image not chosen?",
    "japanese": "この研究は、一枚の使われなかった画像から始まりました。生成AIでは、生徒は短時間で多くの画像を得ます。私は、最終的に選ばれた画像だけでなく、選ばれなかった画像にも関心をもちました。",
    "id": "slide-03"
  },
  {
    "no": 4,
    "title": "Hidden criterion",
    "image": "slides/slide-04.png",
    "english": "The student's short words were very important. The student said that the image felt heavy, too dark, and too busy. These words are small, but they reveal a hidden criterion. The student was looking for an image that was brighter, clearer, and closer to the intended expression.",
    "japanese": "生徒の短い言葉は重要でした。「重い」「暗すぎる」「ごちゃごちゃしている」といった言葉は小さな記述ですが、そこには生徒の評価基準が表れています。",
    "id": "slide-04"
  },
  {
    "no": 5,
    "title": "Background",
    "image": "slides/slide-05.png",
    "english": "Generative AI has changed the speed of idea sketches. Before AI, students usually made a small number of sketches slowly. With AI, they can produce many polished options very quickly. This creates a new classroom tempo, and it also changes how students compare and judge their ideas.",
    "japanese": "生成AIはアイデアスケッチの速度を変えました。以前は少数のスケッチを時間をかけて描いていましたが、AIでは完成度の高い候補を短時間で多く得られます。",
    "id": "slide-05"
  },
  {
    "no": 6,
    "title": "Canva demo",
    "image": "slides/slide-06.png",
    "english": "Next, I will show a short video of the classroom workflow. Students open Canva for Education, generate several images, compare them, choose one, review it, and revise their prompt. Please notice that the important point is not only the final image, but the choices made along the way.",
    "japanese": "ここでは、授業での流れを短い動画で示します。生徒はCanva for Educationを開き、画像を生成し、比較し、選択し、理由を振り返り、プロンプトを修正します。",
    "id": "slide-06"
  },
  {
    "no": 7,
    "title": "Purpose",
    "image": "slides/slide-07.png",
    "english": "Therefore, I examined the traces that remain before the final image. These traces include prompts, generated images, choices, short reasons, and revisions. I call them process traces. They help us see students' evaluative decisions during the creative process.",
    "japanese": "そこで本研究では、最終画像に至る前に残る記録に注目しました。プロンプト、生成画像、選択、短い理由、修正などをプロセスの記録として扱います。",
    "id": "slide-07"
  },
  {
    "no": 8,
    "title": "Problem",
    "image": "slides/slide-08.png",
    "english": "A final image can hide the thinking process. When we look only at the final product, it may look polished and successful. However, we cannot easily see what the student rejected, what the student changed, or why the student made that decision.",
    "japanese": "最終画像だけを見ると、思考の過程が見えにくくなります。見た目は完成していても、何を選ばなかったのか、なぜ変えたのかは分かりにくいのです。",
    "id": "slide-08"
  },
  {
    "no": 9,
    "title": "Core message",
    "image": "slides/slide-09.png",
    "english": "Here is the core message again. Non-selected images are not failed images. They are learning traces. They show what students rejected, what they wanted to keep, and how their criteria began to develop.",
    "japanese": "本研究の中心メッセージです。選ばれなかった画像は失敗ではありません。生徒が何を退け、何を残そうとしたのかを示す学びの記録です。",
    "id": "slide-09"
  },
  {
    "no": 10,
    "title": "Framework 2: CSRI",
    "image": "slides/slide-10.png",
    "english": "The second framework is C S R I. C S R I means Compare, Select, Review, and Iterate. Students compare several AI images, select one option, review the reason, and iterate by changing the prompt or direction. In this study, C S R I is used as a unit for segmenting the process.",
    "japanese": "二つ目の枠組みはCSRIです。Compare、Select、Review、Iterateの四つの活動を、プロセスを区切る単位として用います。",
    "id": "slide-10"
  },
  {
    "no": 11,
    "title": "Framework 3: CAPGAP",
    "image": "slides/slide-11.png",
    "english": "The third framework is CAPGAP. CAPGAP helps interpret the mismatch behind students' decisions. A cognitive gap appears when meaning, form, or composition does not fit the student's intention. An affective gap appears when feelings, such as heavy, cute, or uncomfortable, guide the judgment. A participatory gap appears when tools, teachers, or peers influence the decision.",
    "japanese": "三つ目の枠組みはCAPGAPです。生徒の意思決定の背後にあるズレを、認知的、感情的、参加的な側面から解釈します。",
    "id": "slide-11"
  },
  {
    "no": 12,
    "title": "Framework recap",
    "image": "slides/slide-12.png",
    "english": "In this study, C S R I and CAPGAP have different roles. C S R I tells us what happened in the process. CAPGAP helps us explain why the direction changed. In other words, C S R I is for segmentation, and CAPGAP is for interpretation.",
    "japanese": "本研究では、CSRIとCAPGAPの役割を分けています。CSRIは何が起きたかを区切るため、CAPGAPはなぜ方向が変わったのかを解釈するために使います。",
    "id": "slide-12"
  },
  {
    "no": 13,
    "title": "Method: classroom",
    "image": "slides/slide-13.png",
    "english": "The activity took place in a regular lower-secondary art class. Students used Canva for Education during a fifty-minute lesson. About thirty minutes were used for AI image generation and selection. The activity was part of normal classroom practice, not a special laboratory setting.",
    "japanese": "実践は通常の中学校美術科の授業で行われました。50分授業の中で、約30分をAI画像の生成と選択に使いました。",
    "id": "slide-13"
  },
  {
    "no": 14,
    "title": "Method: data",
    "image": "slides/slide-14.png",
    "english": "The data were naturally remaining classroom traces. They included prompts, generated images, choices, and brief reasons. These were not additional tests. They were records that appeared naturally while students worked with generative AI.",
    "japanese": "データは授業中に自然に残った記録です。追加のテストではなく、生成AIを使って活動する中で生じたプロンプト、画像、選択、短い理由を対象にしました。",
    "id": "slide-14"
  },
  {
    "no": 15,
    "title": "Analysis",
    "image": "slides/slide-15.png",
    "english": "The analysis had two steps. First, I segmented the activity using C S R I. This step showed where comparison, selection, review, and iteration appeared. Second, I interpreted the review words and changes using CAPGAP. This step helped explain the meaning of the mismatch.",
    "japanese": "分析は二段階で行いました。まずCSRIで活動を区切り、次にレビュー語や変化をCAPGAPで解釈しました。",
    "id": "slide-15"
  },
  {
    "no": 16,
    "title": "Results guide",
    "image": "slides/slide-16.png",
    "english": "Before showing the result, I will explain how to read the graph. The horizontal axis shows whether a student wrote a review note. The vertical axis shows whether iteration was visible. The four colors show four patterns: neither, review only, iterate only, and both.",
    "japanese": "結果を見る前に、グラフの読み方を説明します。横軸はレビューの有無、縦軸は反復の有無を示しています。",
    "id": "slide-16"
  },
  {
    "no": 17,
    "title": "Results 1",
    "image": "slides/slide-17.png",
    "english": "The total number of students was seventy-one. Thirteen students had neither review notes nor visible iteration. Three students had review notes only. Thirty-seven students had iteration only. Eighteen students had both review notes and iteration. Overall, fifty-five students iterated, while only twenty-one students wrote review notes.",
    "japanese": "対象は71名です。反復が見られた生徒は55名でした。一方で、レビューを書いた生徒は21名にとどまりました。",
    "id": "slide-17"
  },
  {
    "no": 18,
    "title": "Results 1: interpretation",
    "image": "slides/slide-18.png",
    "english": "This result shows an important point. Revision was visible, but reasoning was uneven. Many students changed their prompt or direction, even when they did not write a clear review note. This means that the process trace can show decision-making that is not fully expressed in words.",
    "japanese": "この結果は、修正は見えるが、理由の記述は一様ではないことを示しています。明確なレビューがなくても、プロンプトや方向の変化から意思決定が見える場合があります。",
    "id": "slide-18"
  },
  {
    "no": 19,
    "title": "Case 1: non-selected image",
    "image": "slides/slide-19.png",
    "english": "Now I will show one case. The non-selected image helped reveal what felt wrong to the student. The student described it as heavy, too dark, and too busy. These words suggest that the image did not match the student's intended atmosphere.",
    "japanese": "ここでは一つの事例を示します。選ばれなかった画像は、生徒が何に違和感をもったのかを明らかにする手がかりになりました。",
    "id": "slide-19"
  },
  {
    "no": 20,
    "title": "Case 1: selected image",
    "image": "slides/slide-20.png",
    "english": "The selected image revealed the emerging criteria. The student moved toward an image that was brighter, clearer, and closer to the intention. By comparing the selected and non-selected images, we can see how the student's evaluative criteria became more visible.",
    "japanese": "選ばれた画像を見ると、生徒の評価基準が立ち上がっていく様子が見えてきます。選択画像と未選択画像を比べることで、その基準がより明確になります。",
    "id": "slide-20"
  },
  {
    "no": 21,
    "title": "Case 2",
    "image": "slides/slide-21.png",
    "english": "In another case, the direction changed through both AI and other people. AI outputs provided several possible directions. At the same time, peers and the teacher influenced how the student interpreted those options. This shows that decision-making was not only individual, but also participatory.",
    "japanese": "別の事例では、AIだけでなく、友人や教師との関わりも方向転換に影響しました。意思決定は個人の中だけで完結せず、参加的に生じていました。",
    "id": "slide-21"
  },
  {
    "no": 22,

const STORAGE_KEY = 'waie_practice_slides_v2';
const SETTINGS_KEY = 'waie_practice_settings_v2';
const DB_NAME = 'waie_practice_persistent_db_v2';
const DB_STORE = 'kv';
let slides = cloneDefaultSlides();
let current = 0;
let voices = [];
let speaking = false;
let currentUtterance = null;
let saveTimer = null;
let lastSavedAt = null;
let dbPromise = null;
let fileHandle = null;
let recognizing = false;
let recognition = null;

const $ = (id) => document.getElementById(id);
function cloneDefaultSlides() { return JSON.parse(JSON.stringify(DEFAULT_SLIDES)); }
function setStatus(msg) { $('status').textContent = msg; }
function setSaveStatus(msg) { $('saveStatus').textContent = msg; }
function validSlides(data) {
  return Array.isArray(data) && data.length > 0 && data.every(s => s && s.image && typeof s.english === 'string' && typeof s.japanese === 'string');
}
function normalizePayload(data) {
  if (validSlides(data)) return { version: 1, slides: data, savedAt: null };
  if (data && validSlides(data.slides)) return data;
  return null;
}
function openDB() {
  if (!('indexedDB' in window)) return Promise.resolve(null);
  if (dbPromise) return dbPromise;
  dbPromise = new Promise((resolve) => {
    const req = indexedDB.open(DB_NAME, 1);
    req.onupgradeneeded = () => req.result.createObjectStore(DB_STORE);
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => resolve(null);
  });
  return dbPromise;
}
async function idbGet(key) {
  const db = await openDB();
  if (!db) return null;
  return new Promise((resolve) => {
    const tx = db.transaction(DB_STORE, 'readonly');
    const req = tx.objectStore(DB_STORE).get(key);
    req.onsuccess = () => resolve(req.result || null);
    req.onerror = () => resolve(null);
  });
}
async function idbSet(key, value) {
  const db = await openDB();
  if (!db) return false;
  return new Promise((resolve) => {
    const tx = db.transaction(DB_STORE, 'readwrite');
    tx.objectStore(DB_STORE).put(value, key);
    tx.oncomplete = () => resolve(true);
    tx.onerror = () => resolve(false);
  });
}
async function idbDelete(key) {
  const db = await openDB();
  if (!db) return false;
  return new Promise((resolve) => {
    const tx = db.transaction(DB_STORE, 'readwrite');
    tx.objectStore(DB_STORE).delete(key);
    tx.oncomplete = () => resolve(true);
    tx.onerror = () => resolve(false);
  });
}
async function loadPersistentSlides() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const payload = normalizePayload(JSON.parse(raw));
      if (payload) return payload;
    }
  } catch(e) {}
  const idbPayload = normalizePayload(await idbGet('slides'));
  if (idbPayload) return idbPayload;
  return null;
}
function getCurrentPayload() {
  return { version: 2, savedAt: new Date().toISOString(), slides };
}
function saveCurrentTextNoQueue() {
  if (!slides[current]) return;
  $('enText') && (slides[current].english = $('enText').value);
  $('jaText') && (slides[current].japanese = $('jaText').value);
}
function queueSave(reason = 'auto') {
  saveCurrentTextNoQueue();
  clearTimeout(saveTimer);
  setSaveStatus('編集中です。まもなく自動保存します…');
  saveTimer = setTimeout(() => saveNow(reason), 450);
}
async function saveNow(reason = 'manual') {
  saveCurrentTextNoQueue();
  const payload = getCurrentPayload();
  let okLocal = false;
  let okIDB = false;
  let okFile = false;
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(payload));
    okLocal = true;
  } catch(e) {}
  try { okIDB = await idbSet('slides', payload); } catch(e) {}
  if (fileHandle) {
    okFile = await writeConnectedFile(payload);
  }
  lastSavedAt = new Date();
  const parts = [];
  if (okLocal) parts.push('ブラウザ保存');
  if (okIDB) parts.push('予備保存');
  if (okFile) parts.push('JSONファイル保存');
  const fileHint = fileHandle ? '' : '　※「保存接続」を押すとJSONファイルにも保存できます。';
  setSaveStatus((parts.length ? parts.join('＋') : '保存に失敗') + '：' + lastSavedAt.toLocaleTimeString() + fileHint);
  return okLocal || okIDB || okFile;
}
async function verifyPermission(handle, readWrite = true) {
  if (!handle || !handle.queryPermission) return false;
  const opts = readWrite ? { mode: 'readwrite' } : {};
  if ((await handle.queryPermission(opts)) === 'granted') return true;
  if ((await handle.requestPermission(opts)) === 'granted') return true;
  return false;
}
async function connectSaveFile() {
  if (!window.showSaveFilePicker) {
    setStatus('このブラウザでは「保存接続」が使えません。代わりに「書出」でJSONバックアップを保存してください。GitHub PagesまたはPC版Chrome/Edgeがおすすめです。');
    return;
  }
  try {
    const handle = await window.showSaveFilePicker({
      suggestedName: 'waie_scenario_data.json',
      types: [{ description: 'WAIE scenario JSON', accept: { 'application/json': ['.json'] } }]
    });
    fileHandle = handle;
    await idbSet('fileHandle', handle);
    await saveNow('connect-file');
    setStatus('保存ファイルを接続しました。これ以降、編集内容はブラウザ内とJSONファイルの両方に保存されます。');
  } catch(e) {
    setStatus('保存ファイル接続をキャンセルしました。');
  }
}
async function writeConnectedFile(payload) {
  try {
    if (!fileHandle) return false;
    const permitted = await verifyPermission(fileHandle, true);
    if (!permitted) return false;
    const writable = await fileHandle.createWritable();
    await writable.write(JSON.stringify(payload, null, 2));
    await writable.close();
    return true;
  } catch(e) {
    return false;
  }
}

async function loadSettings() {
  let settings = null;

  if (!settings) settings = await idbGet('settings');

function escapeHtml(text) {
  return String(text).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
}
function displayNumber(idx) { return String(idx + 1).padStart(2, '0'); }
function originalNumber(s) { return String(s.no || '?').padStart(2, '0'); }

function buildNav() {
  const nav = $('slideNav');
  nav.innerHTML = '';
  slides.forEach((s, idx) => {
    const row = document.createElement('div');
    row.className = 'navItem' + (idx === current ? ' active' : '');
    const select = document.createElement('button');
    select.className = 'navSelect';
    select.innerHTML = '<span class="navTitle"><strong>' + displayNumber(idx) + '</strong> ' + escapeHtml(s.title || 'Slide') + '</span><span class="tiny">元 ' + originalNumber(s) + '</span>';
    select.onclick = () => selectSlide(idx);
    const up = document.createElement('button');
    up.className = 'miniBtn';
    up.textContent = '↑';
    up.disabled = idx === 0;
    up.onclick = (ev) => { ev.stopPropagation(); moveSlide(idx, idx - 1); };
    const down = document.createElement('button');
    down.className = 'miniBtn';
    down.textContent = '↓';
    down.disabled = idx === slides.length - 1;
    down.onclick = (ev) => { ev.stopPropagation(); moveSlide(idx, idx + 1); };
    row.appendChild(select); row.appendChild(up); row.appendChild(down);
    nav.appendChild(row);
  });
  $('moveUpMain').disabled = current <= 0;
  $('moveDownMain').disabled = current >= slides.length - 1;
}
function selectSlide(idx) {
  saveCurrentTextNoQueue();
  current = Math.max(0, Math.min(idx, slides.length - 1));
  const s = slides[current];
  $('slideTitle').textContent = s.title || 'Slide';
  $('slideNo').textContent = 'Now ' + displayNumber(current) + ' / ' + slides.length + '　元のスライド: ' + originalNumber(s);
  $('slideImage').src = s.image;
  $('enText').value = s.english || '';
  $('jaText').value = s.japanese || '';
  buildNav();
  stopSpeech(false);
}
function moveSlide(from, to) {
  if (to < 0 || to >= slides.length || from === to) return;
  saveCurrentTextNoQueue();
  const moving = slides.splice(from, 1)[0];
  slides.splice(to, 0, moving);
  current = to;
  selectSlide(current);
  queueSave('move');
  setStatus('スライド・英語・日本語をセットで移動しました。');
}
async function resetAll() {
  if (!confirm('初期状態に戻しますか？ 編集した英語・日本語と並び順は消えます。')) return;

function importData(file) {
  if (!file) return;
  const reader = new FileReader();
  reader.onload = async () => {
    try {
      const payload = normalizePayload(JSON.parse(reader.result));
      if (!payload) throw new Error('format');
      slides = payload.slides;
      current = 0;
      selectSlide(0);
      await saveNow('import');
      setStatus('台本データを読み込み、保存しました。');
    } catch(e) { setStatus('読み込みできませんでした。JSON形式を確認してください。'); }
  };
  reader.readAsText(file, 'utf-8');
}

function loadVoices() {
  if (!('speechSynthesis' in window)) {
    setStatus('このブラウザは音声読み上げに対応していません。ChromeまたはEdgeで開いてください。');
    return [];
  }
  voices = window.speechSynthesis.getVoices() || [];
  const en = $('enVoice');
  const ja = $('jaVoice');
  const oldEn = en.value;
  const oldJa = ja.value;
  en.innerHTML = '';
  ja.innerHTML = '';
  const enVoices = voices.filter(v => /^en/i.test(v.lang));
  const jaVoices = voices.filter(v => /^ja/i.test(v.lang));
  enVoices.forEach(v => en.appendChild(new Option(v.name + ' (' + v.lang + ')', v.name)));
  jaVoices.forEach(v => ja.appendChild(new Option(v.name + ' (' + v.lang + ')', v.name)));
  if (!en.children.length) en.appendChild(new Option('Default English voice', ''));
  if (!ja.children.length) ja.appendChild(new Option('Default Japanese voice', ''));
  const bestEn = enVoices.find(v => /Microsoft|Natural|Google US English|Samantha|English/i.test(v.name)) || enVoices[0];
  const bestJa = jaVoices.find(v => /Microsoft|Nanami|Haruka|Kyoko|Google|日本|Japanese/i.test(v.name)) || jaVoices[0];
  if (oldEn) en.value = oldEn; else if (bestEn) en.value = bestEn.name;
  if (oldJa) ja.value = oldJa; else if (bestJa) ja.value = bestJa.name;
  return voices;
}
function pickVoice(lang) {
  loadVoices();
  const selected = lang === 'ja-JP' ? $('jaVoice').value : $('enVoice').value;
  return voices.find(v => v.name === selected) || voices.find(v => v.lang === lang) || voices.find(v => v.lang && v.lang.toLowerCase().startsWith(lang.slice(0,2).toLowerCase())) || null;
}
function makeChunks(text, maxLen = 86) {
  const clean = String(text || '').replace(/\s+/g, ' ').trim();
  if (!clean) return [];
  const sentences = clean.match(/[^.!?。！？]+[.!?。！？]?/g) || [clean];
  const chunks = [];
  for (const sentence of sentences) {
    let s = sentence.trim();
    if (!s) continue;
    while (s.length > maxLen) {
      let cut = s.lastIndexOf(',', maxLen);
      if (cut < 40) cut = s.lastIndexOf(' ', maxLen);
      if (cut < 40) cut = maxLen;
      chunks.push(s.slice(0, cut).trim());
      s = s.slice(cut).trim();
    }
    if (s) chunks.push(s);
  }
  return chunks;
}
function stopSpeech(updateStatus = true) {
  speaking = false;
  currentUtterance = null;
  if ('speechSynthesis' in window) {
    try { window.speechSynthesis.cancel(); } catch(e) {}
  }
  if (updateStatus) setStatus('停止しました。');
}
function speakText(text, lang) {
  if (!('speechSynthesis' in window)) {
    setStatus('音声読み上げが使えません。PCのChromeまたはEdgeで開いてください。');
    return;
  }
  stopSpeech(false);
  loadVoices();
  const chunks = makeChunks(text, lang === 'en-US' ? 82 : 70);
  if (!chunks.length) { setStatus('読む文字がありません。'); return; }
  const rate = Number($('rate').value || 0.78);
  const pitch = Number($('pitch').value || 1.0);
  const voice = pickVoice(lang);
  let i = 0;
  speaking = true;
  setStatus('読み上げ中です。短く区切って読むので、途中で切れにくくしています。');
  function next() {
    if (!speaking) return;
    if (i >= chunks.length) {
      speaking = false;
      currentUtterance = null;
      setStatus('読み上げが終わりました。');
      return;
    }
    const u = new SpeechSynthesisUtterance(chunks[i]);
    currentUtterance = u;
    u.lang = lang;
    u.rate = rate;
    u.pitch = pitch;
    if (voice) u.voice = voice;
    const partNo = i + 1;
    i += 1;
    u.onstart = () => setStatus('読み上げ中 ' + partNo + ' / ' + chunks.length);
    u.onend = () => setTimeout(next, 90);
    u.onerror = (e) => {
      if (!speaking) return;
      setStatus('音声が一度止まりました。もう一度「読む」を押してください。エラー: ' + (e.error || 'unknown'));
      speaking = false;
    };
    window.speechSynthesis.speak(u);
    setTimeout(() => { try { window.speechSynthesis.resume(); } catch(e) {} }, 200);
  }
  next();
}

function startDictation() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) {
    setStatus('このブラウザでは音声入力が使えません。PC版ChromeまたはEdgeで試してください。');
    return;
  }
  if (recognizing) {
    recognition.stop();
    return;
  }
  recognition = new SR();
  recognition.lang = 'ja-JP';
  recognition.continuous = true;
  recognition.interimResults = true;
  recognizing = true;
  $('dictateBtn').textContent = '音声入力停止';
  $('dictateBtn').classList.remove('warn');
  $('dictateBtn').classList.add('stop');
  let baseText = $('jaText').value.trim();
  recognition.onresult = (event) => {
    let finalText = '';
    let interimText = '';
    for (let i = event.resultIndex; i < event.results.length; i++) {
      const t = event.results[i][0].transcript;
      if (event.results[i].isFinal) finalText += t;
      else interimText += t;
    }
    if (finalText) {
      baseText = (baseText ? baseText + '\n' : '') + finalText.trim();
      $('jaText').value = baseText;
      queueSave('dictation');
    }
    if (interimText) setStatus('音声入力中：' + interimText);
  };
  recognition.onerror = (e) => setStatus('音声入力エラー：' + (e.error || 'unknown'));
  recognition.onend = () => {
    recognizing = false;
    $('dictateBtn').textContent = '日本語音声入力';
    $('dictateBtn').classList.add('warn');
    $('dictateBtn').classList.remove('stop');
    setStatus('音声入力を停止しました。必要なら「英訳→English欄」を押してください。');
  };
  recognition.start();
  setStatus('日本語音声入力を開始しました。話した内容は日本語メモに入ります。');
}
async function translateJaToEnglish() {
  const text = $('jaText').value.trim();
  if (!text) { setStatus('日本語メモが空です。先に日本語を入力してください。'); return; }
  let translation = '';
  const endpoint = $('translationEndpoint').value.trim();
  setStatus('英訳中です。');
  try {
    if (endpoint) {
      const res = await fetch(endpoint, {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({ text, source: 'ja', target: 'en' })
      });
      if (!res.ok) throw new Error('API status ' + res.status);
      const data = await res.json();
      translation = data.translation || data.translatedText || data.text || '';
    } else {
      const ok = confirm('翻訳API URLが未設定です。試用の外部翻訳APIに日本語メモを送って英訳しますか？\n\n発表練習用の文章には使えますが、個人情報や生徒情報は送らないでください。');
      if (!ok) { setStatus('英訳をキャンセルしました。翻訳API URLを設定すると、確認なしで使えます。'); return; }
      const url = 'https://api.mymemory.translated.net/get?q=' + encodeURIComponent(text) + '&langpair=ja|en';
      const res = await fetch(url);
      if (!res.ok) throw new Error('public translation status ' + res.status);
      const data = await res.json();
      translation = data && data.responseData && data.responseData.translatedText ? data.responseData.translatedText : '';
    }
    if (!translation) throw new Error('empty translation');
    if ($('replaceEnglish').checked) {
      $('enText').value = translation;
    } else {
      $('enText').value = ($('enText').value.trim() ? $('enText').value.trim() + '\n\n' : '') + translation;
    }
    queueSave('translation');
    setStatus('英訳しました。必要に応じてEnglish欄を整えてください。');
  } catch(e) {
    setStatus('英訳に失敗しました。ネット接続、翻訳API URL、または外部APIの制限を確認してください。');
  }
}

  $('jaText').addEventListener('input', () => queueSave('edit-ja'));
  $('rate').oninput = () => { $('rateView').textContent = $('rate').value; saveSettings(); };
  $('pitch').oninput = () => { $('pitchView').textContent = $('pitch').value; saveSettings(); };
  $('enVoice').onchange = saveSettings;
  $('jaVoice').onchange = saveSettings;
  $('translationEndpoint').onchange = saveSettings;
  $('replaceEnglish').onchange = saveSettings;
  $('saveSettingsBtn').onclick = saveSettings;
  $('dictateBtn').onclick = startDictation;
  $('translateBtn').onclick = translateJaToEnglish;
  window.addEventListener('beforeunload', () => {
    saveCurrentTextNoQueue();
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(getCurrentPayload())); } catch(e) {}
  });
}
async function init() {
  attachEvents();
  if ('speechSynthesis' in window) {
    loadVoices();
    window.speechSynthesis.onvoiceschanged = () => { loadVoices(); };
    setTimeout(loadVoices, 300);
    setTimeout(loadVoices, 1000);
  }
  await loadSettings();
  const payload = await loadPersistentSlides();
  if (payload && validSlides(payload.slides)) {
    slides = payload.slides;
    setSaveStatus('保存済みデータを読み込みました。最終保存: ' + (payload.savedAt ? new Date(payload.savedAt).toLocaleString() : '不明'));
  } else {
    slides = cloneDefaultSlides();
    setSaveStatus('初期台本を読み込みました。編集後は自動保存されます。');
    await saveNow('initial');
  }
  fileHandle = await idbGet('fileHandle');
  if (fileHandle) setSaveStatus($('saveStatus').textContent + '　保存ファイル接続あり。');
  selectSlide(0);
  const protocolHint = location.protocol === 'file:' ? '現在 file:// で開いています。保存が不安定な場合はGitHub Pagesで開くか、「保存接続」を使ってください。' : 'このURLで開く限り、自動保存は次回起動時にも残ります。';
  setStatus('準備できました。' + protocolHint);
}
init();

if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').then(reg => reg.update()).catch(() => {});
  });
}
</script>
</body>
</html>
