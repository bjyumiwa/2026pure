<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f76aa8">
<title>WAIE 2026 読み上げ練習アプリ Mobile</title>
<style>
  :root {
    --bg:#fff7fb;
    --panel:#ffffff;
    --ink:#26222a;
    --muted:#776c78;
    --accent:#e95f9a;
    --accent-deep:#bf2f72;
    --soft:#ffe4f0;
    --line:#f2d3e2;
    --shadow:0 10px 28px rgba(118, 35, 88, .14);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
  html { font-size: 16px; }
  body {
    margin:0;
    min-height:100dvh;
    color:var(--ink);
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans JP", "Hiragino Sans", sans-serif;
    background: radial-gradient(circle at 10% 0%, #ffe0ef 0, transparent 32%), linear-gradient(150deg, var(--bg), #f7f2ff 88%);
  }
  .app { width:min(100%, 760px); margin:0 auto; padding:12px 12px calc(98px + var(--safe-bottom)); }
  header { padding:8px 2px 10px; }
  h1 { margin:0; font-size:1.25rem; line-height:1.35; letter-spacing:.02em; }
  .sub { margin:.35rem 0 0; font-size:.88rem; color:var(--muted); line-height:1.5; }
  .top-card {
    position:sticky; top:0; z-index:5;
    margin:0 -12px 10px; padding:10px 12px;
    background:rgba(255,247,251,.94); backdrop-filter: blur(12px);
    border-bottom:1px solid rgba(242,211,226,.75);
  }
  .status-row { display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:8px; }
  .badge { display:inline-flex; align-items:center; gap:6px; border-radius:999px; padding:7px 10px; background:#fff; border:1px solid var(--line); box-shadow:0 4px 12px rgba(0,0,0,.04); font-weight:700; }
  .badge small { color:var(--muted); font-weight:600; }
  .state { font-size:.86rem; color:var(--muted); white-space:nowrap; }
  .progress { height:9px; border-radius:999px; overflow:hidden; background:#fff; border:1px solid var(--line); }
  .bar { height:100%; width:0%; background:linear-gradient(90deg, var(--accent), #8a5cf6); transition: width .18s ease; }
  .card { background:rgba(255,255,255,.94); border:1px solid rgba(242,211,226,.94); border-radius:22px; box-shadow:var(--shadow); }
  .panel { padding:14px; }
  label { display:block; font-weight:700; color:var(--ink); margin-bottom:7px; }
  select, textarea, input[type="range"] { width:100%; }
  select { min-height:48px; border-radius:15px; border:1px solid var(--line); background:#fff; padding:0 12px; font-size:1rem; }
  .slide-menu { margin-bottom:12px; }
  .script-head { display:flex; align-items:center; justify-content:space-between; gap:8px; margin:6px 0 8px; }
  .script-head h2 { margin:0; font-size:1.25rem; }
  .count { color:var(--muted); font-size:.9rem; }
  textarea {
    min-height:42dvh;
    resize:vertical;
    border:1px solid var(--line);
    border-radius:20px;
    padding:15px;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Noto Sans Mono", monospace;
    font-size:1.08rem;
    line-height:1.75;
    color:#1f1a24;
    background:#fffdfd;
    outline:none;
  }
  textarea:focus { border-color:#f09bc1; box-shadow:0 0 0 4px rgba(233,95,154,.14); }
  .hint { font-size:.85rem; color:var(--muted); line-height:1.55; margin:10px 2px 0; }
  .primary-area { display:grid; grid-template-columns:1fr; gap:10px; margin-top:12px; }
  button {
    min-height:50px;
    border:0;
    border-radius:16px;
    padding:12px 14px;
    font-size:1rem;
    font-weight:800;
    background:#fff;
    color:var(--ink);
    border:1px solid var(--line);
    box-shadow:0 6px 15px rgba(74,29,63,.07);
    cursor:pointer;
  }
  button:active { transform:translateY(1px); }
  .primary { background:linear-gradient(135deg, var(--accent), var(--accent-deep)); color:#fff; border-color:transparent; min-height:58px; font-size:1.08rem; }
  .danger { color:#a0184d; background:#fff5f8; }
  .grid-2 { display:grid; grid-template-columns:1fr 1fr; gap:9px; }
  .grid-3 { display:grid; grid-template-columns:1fr 1fr 1fr; gap:9px; }
  .settings { display:grid; gap:12px; margin-top:12px; }
  .mini-row { display:flex; justify-content:space-between; align-items:center; gap:8px; font-size:.92rem; color:var(--muted); margin-bottom:5px; }
  .check { display:flex; align-items:flex-start; gap:8px; padding:10px 12px; background:#fff; border:1px solid var(--line); border-radius:15px; color:var(--muted); font-size:.92rem; line-height:1.4; }
  .check input { margin-top:3px; transform:scale(1.15); }
  .bottom-nav {
    position:fixed; left:0; right:0; bottom:0; z-index:10;
    background:rgba(255,255,255,.96); backdrop-filter: blur(14px);
    border-top:1px solid var(--line);
    padding:10px 12px calc(10px + var(--safe-bottom));
  }
  .bottom-inner { width:min(100%, 760px); margin:0 auto; display:grid; grid-template-columns:1fr 1.5fr 1fr; gap:9px; }
  .bottom-inner button { min-height:54px; }
  .toast { position:fixed; left:50%; bottom:calc(92px + var(--safe-bottom)); transform:translateX(-50%) translateY(12px); opacity:0; pointer-events:none; background:#2c2530; color:#fff; padding:10px 14px; border-radius:999px; transition:.2s; z-index:20; white-space:nowrap; }
  .toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
  details { margin-top:12px; }
  summary { cursor:pointer; font-weight:800; padding:10px 2px; color:#513547; }
  .slide-list { display:grid; grid-template-columns:1fr; gap:8px; margin-top:6px; }
  .slide-btn { text-align:left; min-height:auto; padding:11px 12px; box-shadow:none; }
  .slide-btn.active { border-color:#f09bc1; background:var(--soft); }
  .slide-btn span { display:block; }
  .slide-btn .small { font-size:.82rem; color:var(--muted); font-weight:600; margin-top:4px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  @media (min-width: 700px) {
    .app { padding-top:20px; }
    h1 { font-size:1.65rem; }
    .main-grid { display:grid; grid-template-columns:260px 1fr; gap:14px; align-items:start; }
    .desktop-list { display:block; }
    .mobile-select-only { display:none; }
    textarea { min-height:52dvh; }
  }
  @media (max-width: 699px) {
    .desktop-list { display:none; }
    .grid-3 { grid-template-columns:1fr; }
    .grid-2.compact { grid-template-columns:1fr 1fr; }
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>WAIE 2026 読み上げ練習</h1>
    <p class="sub">携帯で見やすいように、1スライドずつ大きく表示します。文章が抜けていたSlide 01・10・11も補っています。</p>
  </header>

  <div class="top-card">
    <div class="status-row">
      <div class="badge"><span id="slideBadge">Slide 01</span><small id="slideCount">1 / 13</small></div>
      <div class="state" id="stateText">停止中</div>
    </div>
    <div class="progress"><div class="bar" id="bar"></div></div>
  </div>

  <div class="main-grid">
    <aside class="card panel desktop-list">
      <label>スライド一覧</label>
      <div class="slide-list" id="slideList"></div>
    </aside>

    <main class="card panel">
      <div class="slide-menu mobile-select-only">
        <label for="slideSelect">スライドを選ぶ</label>
        <select id="slideSelect"></select>
      </div>

      <div class="script-head">
        <h2 id="slideTitle">Slide 01</h2>
        <span class="count" id="wordCount">0 words</span>
      </div>

      <textarea id="script" spellcheck="false" aria-label="speaker script"></textarea>
      <p class="hint">編集したら「保存」を押してください。保存内容はこの端末のブラウザに残ります。</p>

      <div class="primary-area">
        <button id="playBtn" class="primary">▶ このスライドを読む</button>
        <div class="grid-2 compact">
          <button id="pauseBtn">⏸ 一時停止</button>
          <button id="stopBtn" class="danger">■ 停止</button>
        </div>
        <div class="grid-2 compact">
          <button id="resumeBtn">⏵ 再開</button>
          <button id="playAllBtn">▶ 全部読む</button>
        </div>
      </div>

      <details>
        <summary>声・速度・保存の設定</summary>
        <div class="settings">
          <div>
            <label for="voiceSelect">声を選ぶ</label>
            <select id="voiceSelect"></select>
          </div>
          <div>
            <div class="mini-row"><strong>速度</strong><span id="rateValue">0.90</span></div>
            <input id="rate" type="range" min="0.6" max="1.25" step="0.05" value="0.9">
          </div>
          <div>
            <div class="mini-row"><strong>高さ</strong><span id="pitchValue">1.00</span></div>
            <input id="pitch" type="range" min="0.7" max="1.3" step="0.05" value="1">
          </div>
          <label class="check"><input type="checkbox" id="autoNext" checked> このスライドが終わったら自動で次へ進む</label>
          <div class="grid-2">
            <button id="saveBtn">保存</button>
            <button id="copyBtn">コピー</button>
          </div>
          <button id="resetBtn" class="danger">原稿を初期状態に戻す</button>
          <p class="hint">iPhoneやAndroidでは、最初にボタンを押した時だけ音声が有効になる場合があります。Chrome、Edge、Safariで確認してください。</p>
        </div>
      </details>
    </main>
  </div>
</div>

<nav class="bottom-nav" aria-label="mobile navigation">
  <div class="bottom-inner">
    <button id="prevBtn">← 前へ</button>
    <button id="bottomPlayBtn" class="primary">▶ 読む</button>
    <button id="nextBtn">次へ →</button>
  </div>
</nav>
<div class="toast" id="toast"></div>

<script>
const originalSlides = [
  {
    "num": 1,
    "title": "Slide 01",
    "text": "Hello everyone. Thank you for joining my presentation.\nToday, I will talk about process-trace analysis in generative AI-supported art education.\nMy focus is on how students make evaluative decisions before choosing a final image."
  },
  {
    "num": 2,
    "title": "Slide 02",
    "text": "Believe it or not, generative AI has transformed art education.\nBefore AI, students spent more time slowly developing their ideas through sketches.\nWith AI, students can quickly generate many polished images.\nThis creates a new tempo in the classroom."
  },
  {
    "num": 3,
    "title": "Slide 03",
    "text": "We might be surprised by this change, but actually, this kind of transformation has happened before.\nIn this study, we understand AI as one more tool in the history of art education.\nThis is the first part of our research: ART 5.0."
  },
  {
    "num": 4,
    "title": "Slide 04",
    "text": "In the era of ART 5.0, students face several kinds of gaps.\nWe call these discrepancies CAPGAP: cognitive, affective, and participatory gaps.\nThis framework helped us trace our research focus.\nFrom there, we identified the CSRI cycle."
  },
  {
    "num": 5,
    "title": "Slide 05",
    "text": "C is for Compare, S is for Select, R is for Review, and I is for Iterate.\nThese four stages help us segment the students’ decision-making flow."
  },
  {
    "num": 6,
    "title": "Slide 06",
    "text": "We examined process traces before the final image.\nCSRI allows us to segment and observe the flow of students’ decision-making."
  },
  {
    "num": 7,
    "title": "Slide 07",
    "text": "Now, let’s take a look at a short demonstration.\nWhile using Canva, students compare images, select one, review it, and try again.\nThis is the CSRI cycle in action."
  },
  {
    "num": 8,
    "title": "Slide 08",
    "text": "Now, let’s take a look at an idea sketch.\nThis is actually an image that the student did not select.\nThe reason was that it felt heavy, too dark, and a bit cluttered."
  },
  {
    "num": 9,
    "title": "Slide 09",
    "text": "Then, the student tried again, and this image was created.\nThrough this interaction, the decision shifted toward a brighter and clearer image that aligned more closely with the student’s intent."
  },
  {
    "num": 10,
    "title": "Slide 10",
    "text": "This example can be interpreted through CAPGAP.\nFirst, the mismatch was affective.\nThe student felt that the image was heavy and dark.\nThat feeling became part of the student’s evaluation criterion."
  },
  {
    "num": 11,
    "title": "Slide 11",
    "text": "The next change can also be read as a cognitive and participatory shift.\nThe student compared the images, reviewed the mismatch, and adjusted the direction.\nIn this way, the non-selected image helped the student move to the next decision."
  },
  {
    "num": 12,
    "title": "Slide 12",
    "text": "Here are the overall results.\nWe analyzed 71 students.\nFifty-five students revised their prompts or images.\nHowever, only 21 students wrote review notes.\nInterestingly, 37 students iterated without writing any review notes.\nThis suggests that evaluative decisions may occur even when students do not explicitly record their reflections."
  },
  {
    "num": 13,
    "title": "Slide 13",
    "text": "To conclude, CSRI organized students’ process traces.\nUnselected images and review notes made evaluative decisions visible.\nCAPGAP helped us interpret why students revised their ideas.\nUnselected images are not failures. They are learning traces."
  }
];
const storageKey = 'waie_read_aloud_app_mobile_v2_all_slides';
let slides = loadSlides();
let current = 0;
let voices = [];
let utterance = null;
let playAllMode = false;
let isSpeaking = false;

const slideBadge = document.getElementById('slideBadge');
const slideCount = document.getElementById('slideCount');
const stateText = document.getElementById('stateText');
const scriptBox = document.getElementById('script');
const slideTitle = document.getElementById('slideTitle');
const wordCount = document.getElementById('wordCount');
const slideSelect = document.getElementById('slideSelect');
const slideList = document.getElementById('slideList');
const voiceSelect = document.getElementById('voiceSelect');
const rate = document.getElementById('rate');
const pitch = document.getElementById('pitch');
const rateValue = document.getElementById('rateValue');
const pitchValue = document.getElementById('pitchValue');
const bar = document.getElementById('bar');
const toast = document.getElementById('toast');

function loadSlides() {
  try {
    const saved = localStorage.getItem(storageKey);
    if (saved) {
      const parsed = JSON.parse(saved);
      if (Array.isArray(parsed) && parsed.length === originalSlides.length && parsed.every(s => (s.text || '').trim())) return parsed;
    }
  } catch(e) {}
  return JSON.parse(JSON.stringify(originalSlides));
}
function saveSlides() { localStorage.setItem(storageKey, JSON.stringify(slides)); }
function showToast(msg) {
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 1500);
}
function escapeHtml(str) {
  return String(str).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
}
function firstLine(text) {
  const t = (text || '').trim();
  return t ? t.split(/
/)[0].slice(0, 64) : '文章未入力';
}
function updateWordCount() {
  const text = scriptBox.value.trim();
  const words = text ? text.split(/\s+/).filter(Boolean).length : 0;
  wordCount.textContent = `${words} words`;
}
function renderNavigation() {
  slideSelect.innerHTML = '';
  slideList.innerHTML = '';
  slides.forEach((s, i) => {
    const opt = document.createElement('option');
    opt.value = String(i);
    opt.textContent = `${s.title} — ${firstLine(s.text)}`;
    slideSelect.appendChild(opt);

    const b = document.createElement('button');
    b.className = 'slide-btn' + (i === current ? ' active' : '');
    b.innerHTML = `<span>${escapeHtml(s.title)}</span><span class="small">${escapeHtml(firstLine(s.text))}</span>`;
    b.addEventListener('click', () => { stopSpeech(); current = i; render(); });
    slideList.appendChild(b);
  });
}
function render() {
  renderNavigation();
  slideSelect.value = String(current);
  slideBadge.textContent = slides[current].title;
  slideTitle.textContent = slides[current].title;
  slideCount.textContent = `${current + 1} / ${slides.length}`;
  scriptBox.value = slides[current].text || '';
  updateWordCount();
  bar.style.width = `${Math.round(current / Math.max(1, slides.length - 1) * 100)}%`;
  stateText.textContent = '停止中';
}
function loadVoices() {
  voices = window.speechSynthesis ? speechSynthesis.getVoices() : [];
  voiceSelect.innerHTML = '';
  if (!voices.length) {
    const opt = document.createElement('option');
    opt.textContent = '標準音声'; opt.value = '';
    voiceSelect.appendChild(opt);
    return;
  }
  const ordered = voices.map((v, idx) => ({v, idx})).sort((a,b) => {
    const score = item => (/^en/i.test(item.v.lang || '') ? 0 : /^ja/i.test(item.v.lang || '') ? 1 : 2);
    return score(a) - score(b);
  });
  ordered.forEach(item => {
    const opt = document.createElement('option');
    opt.value = String(item.idx);
    opt.textContent = `${item.v.name} (${item.v.lang})`;
    voiceSelect.appendChild(opt);
  });
  const preferred = ordered.find(item => /^en/i.test(item.v.lang || '') && /Google|Microsoft|Samantha|Jenny|Aria|Daniel|Karen/i.test(item.v.name))
    || ordered.find(item => /^en/i.test(item.v.lang || ''))
    || ordered[0];
  voiceSelect.value = String(preferred.idx);
}
function syncCurrentText() { slides[current].text = scriptBox.value; saveSlides(); }
function speakCurrent(allMode=false) {
  if (!('speechSynthesis' in window)) { showToast('このブラウザは読み上げ非対応です'); return; }
  syncCurrentText();
  const text = scriptBox.value.trim();
  if (!text) { showToast('文章がありません'); return; }
  stopSpeech(false);
  playAllMode = allMode;
  utterance = new SpeechSynthesisUtterance(text);
  const selectedVoice = voices[Number(voiceSelect.value)];
  if (selectedVoice) utterance.voice = selectedVoice;
  utterance.lang = selectedVoice?.lang || 'en-US';
  utterance.rate = Number(rate.value);
  utterance.pitch = Number(pitch.value);
  utterance.onstart = () => { isSpeaking = true; stateText.textContent = allMode ? '全部読み上げ中' : '読み上げ中'; };
  utterance.onboundary = (event) => {
    if (typeof event.charIndex === 'number' && text.length) {
      const pctWithin = event.charIndex / text.length;
      const slidePct = current / Math.max(1, slides.length - 1);
      const nextPct = (current + pctWithin) / Math.max(1, slides.length - 1);
      bar.style.width = `${Math.min(100, Math.round(nextPct * 100))}%`;
    }
  };
  utterance.onend = () => {
    isSpeaking = false;
    stateText.textContent = '停止中';
    if ((playAllMode || document.getElementById('autoNext').checked) && current < slides.length - 1) {
      current += 1;
      render();
      setTimeout(() => speakCurrent(playAllMode), 300);
    } else {
      playAllMode = false;
      bar.style.width = `${Math.round(current / Math.max(1, slides.length - 1) * 100)}%`;
    }
  };
  utterance.onerror = () => { isSpeaking = false; playAllMode = false; stateText.textContent = '読み上げエラー'; };
  speechSynthesis.speak(utterance);
}
function stopSpeech(update=true) {
  if ('speechSynthesis' in window) speechSynthesis.cancel();
  isSpeaking = false; playAllMode = false;
  if (update) stateText.textContent = '停止中';
}
function nextSlide() { syncCurrentText(); stopSpeech(); if (current < slides.length - 1) { current++; render(); } }
function prevSlide() { syncCurrentText(); stopSpeech(); if (current > 0) { current--; render(); } }

document.getElementById('playBtn').addEventListener('click', () => speakCurrent(false));
document.getElementById('bottomPlayBtn').addEventListener('click', () => speakCurrent(false));
document.getElementById('playAllBtn').addEventListener('click', () => speakCurrent(true));
document.getElementById('pauseBtn').addEventListener('click', () => { if ('speechSynthesis' in window) { speechSynthesis.pause(); stateText.textContent = '一時停止中'; } });
document.getElementById('resumeBtn').addEventListener('click', () => { if ('speechSynthesis' in window) { speechSynthesis.resume(); stateText.textContent = '読み上げ中'; } });
document.getElementById('stopBtn').addEventListener('click', () => stopSpeech());
document.getElementById('nextBtn').addEventListener('click', nextSlide);
document.getElementById('prevBtn').addEventListener('click', prevSlide);
document.getElementById('saveBtn').addEventListener('click', () => { syncCurrentText(); renderNavigation(); showToast('保存しました'); });
document.getElementById('copyBtn').addEventListener('click', async () => {
  try { await navigator.clipboard.writeText(scriptBox.value); showToast('コピーしました'); }
  catch(e) { scriptBox.select(); document.execCommand('copy'); showToast('コピーしました'); }
});
document.getElementById('resetBtn').addEventListener('click', () => {
  if (!confirm('この端末に保存した編集内容を消して、初期原稿に戻しますか？')) return;
  localStorage.removeItem(storageKey); slides = JSON.parse(JSON.stringify(originalSlides)); current = 0; stopSpeech(); render(); showToast('初期状態に戻しました');
});
slideSelect.addEventListener('change', e => { syncCurrentText(); stopSpeech(); current = Number(e.target.value); render(); });
scriptBox.addEventListener('input', updateWordCount);
rate.addEventListener('input', () => rateValue.textContent = Number(rate.value).toFixed(2));
pitch.addEventListener('input', () => pitchValue.textContent = Number(pitch.value).toFixed(2));

if ('speechSynthesis' in window) {
  loadVoices();
  speechSynthesis.onvoiceschanged = loadVoices;
} else {
  showToast('このブラウザは読み上げ非対応です');
}
render();
</script>
</body>
</html>
