<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>WAIE Speech Practice - Morning Flow</title>
  <style>
    :root {
      --bg: #fff7fb;
      --panel: #ffffff;
      --ink: #2b2430;
      --muted: #736673;
      --accent: #d84f93;
      --accent2: #7062d9;
      --ok: #1f7a55;
      --warn: #a16100;
      --stop: #403648;
      --border: #eaddea;
      --soft: #fff0f7;
      --shadow: 0 10px 25px rgba(77, 42, 74, .13);
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      overflow: hidden;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--ink);
      background: linear-gradient(135deg, #fff7fb 0%, #f7f5ff 100%);
    }
    .app {
      height: 100dvh;
      display: grid;
      grid-template-columns: 168px minmax(0, 1.24fr) minmax(420px, .9fr);
      gap: 8px;
      padding: 8px;
    }
    .panel {
      background: rgba(255,255,255,.96);
      border: 1px solid var(--border);
      border-radius: 18px;
      box-shadow: var(--shadow);
      overflow: hidden;
      min-height: 0;
    }
    .nav { display:flex; flex-direction:column; }
    .brand { padding: 8px 9px 6px; border-bottom: 1px solid var(--border); }
    h1 { margin:0; font-size: 15px; line-height:1.2; }
    .hint { margin:4px 0 0; color:var(--muted); font-size:10.5px; line-height:1.35; }
    .navTools { display:grid; grid-template-columns:1fr 1fr; gap:5px; padding:6px; border-bottom:1px solid var(--border); }
    .navList { overflow:auto; padding: 6px; min-height:0; }
    .navItem { display:grid; grid-template-columns: 1fr 24px 24px; gap:3px; margin-bottom:4px; }
    .navSelect, .miniBtn, button, .pillBtn {
      border: 1px solid var(--border);
      border-radius: 9px;
      background: #fff;
      color: var(--ink);
      cursor: pointer;
      font-family: inherit;
    }
    .navSelect {
      min-height: 32px;
      text-align:left;
      padding: 5px 6px;
      font-size: 11px;
      line-height: 1.15;
      overflow:hidden;
    }
    .navTitle { display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .navItem.active .navSelect { border-color: var(--accent); background: var(--soft); font-weight:800; }
    .miniBtn { min-height: 28px; padding:0; font-size:12px; font-weight:800; }
    .miniBtn:disabled, button:disabled { opacity:.36; cursor:not-allowed; }

    .slidePanel { display:flex; flex-direction:column; min-width:0; }
    .topbar {
      height: 44px;
      flex: 0 0 auto;
      padding: 6px 8px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:8px;
      border-bottom:1px solid var(--border);
    }
    .slideTitle { font-weight:900; font-size: 14px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .slideNo { color:var(--muted); font-size:11px; white-space:nowrap; }
    .slideImgArea {
      flex: 1 1 auto;
      min-height:0;
      padding: 8px;
      display:grid;
      place-items:center;
      background:#fffafd;
    }
    .slideFrame {
      width:100%;
      height:100%;
      display:grid;
      place-items:center;
      border-radius: 14px;
      border:1px solid var(--border);
      background:#fff;
      overflow:hidden;
    }
    #slideImage { width:100%; height:100%; object-fit:contain; background:#fff; }

    .scriptPanel { display:flex; flex-direction:column; min-width:0; }
    .scriptTop {
      flex:0 0 auto;
      padding:6px 8px;
      border-bottom:1px solid var(--border);
      display:grid;
      grid-template-columns: 1fr;
      gap:6px;
      align-items:center;
    }
    .btnRow { display:flex; gap:5px; flex-wrap:wrap; align-items:center; }
    button {
      min-height: 28px;
      padding: 5px 8px;
      font-size: 11.5px;
      font-weight:800;
      line-height:1;
    }
    button.primary { background:var(--accent); color:#fff; border-color:transparent; }
    button.secondary { background:var(--accent2); color:#fff; border-color:transparent; }
    button.ok { background:var(--ok); color:#fff; border-color:transparent; }
    button.warn { background:var(--warn); color:#fff; border-color:transparent; }
    button.stop { background:var(--stop); color:#fff; border-color:transparent; }
    label {
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:6px;
      margin:0;
      padding: 6px 8px 4px;
      font-weight:900;
      font-size:12px;
      color:var(--ink);
    }
    textarea {
      width: calc(100% - 16px);
      margin: 0 8px;
      border:1px solid var(--border);
      border-radius:12px;
      padding:9px 10px;
      resize:none;
      font-family: inherit;
      color:var(--ink);
      background:#fff;
      line-height:1.55;
      outline:none;
    }
    #enText {
      flex: 1 1 auto;
      min-height: 230px;
      font-size: 17px;
    }
    #jaText {
      flex: 0 0 128px;
      font-size: 13px;
      background:#fffafd;
    }
    .voiceSettings, .translateSettings {
      flex:0 0 auto;
      display:grid;
      grid-template-columns: 1fr 1fr;
      gap:5px;
      padding:6px 8px;
      border-top:1px solid var(--border);
    }
    .translateSettings { grid-template-columns: 1fr auto; background:#fffafd; }
    select, input[type="range"], input[type="url"] { width:100%; font-size:11px; }
    input[type="url"] { border:1px solid var(--border); border-radius:8px; padding:5px 7px; min-height:28px; }
    .checkLabel { padding:0; font-size:11px; font-weight:700; justify-content:flex-start; }
    .tiny { color:var(--muted); font-size:10.5px; line-height:1.25; }
    .status {
      flex:0 0 auto;
      margin: 0 8px 7px;
      padding: 6px 8px;
      border-radius: 10px;
      background:#f7f4ff;
      color:#4a3e65;
      font-size:11.5px;
      line-height:1.35;
      min-height: 42px;
      white-space:pre-wrap;
    }
    .saveStatus {
      padding: 5px 8px;
      margin: 0 8px 6px;
      border-radius: 10px;
      background:#effaf4;
      color:#29563f;
      font-size:10.8px;
      line-height:1.25;
      border:1px solid #d7efdf;
    }
    .fileInput { display:none; }
    @media (max-width: 980px) {
      body { overflow:auto; }
      .app { height:auto; min-height:100dvh; grid-template-columns:1fr; }
      .navList { max-height:170px; }
      .slideFrame { aspect-ratio:16/9; height:auto; }
      #enText { min-height:220px; }
    }
  </style>
</head>
<body>
  <main class="app">
    <nav class="panel nav">
      <div class="brand">
        <h1>WAIE Practice Morning</h1>
        <p class="hint">安定版。自動保存＋バックアップ保存。音声入力と英訳補助つき。</p>
      </div>
      <div class="navTools">
        <button id="resetBtn">初期化</button>
        <button id="exportBtn">書出</button>
        <button id="importBtn">読込</button>
        <input type="file" id="importFile" class="fileInput" accept="application/json,.json" />
      </div>
      <div id="slideNav" class="navList"></div>
    </nav>

    <section class="panel slidePanel">
      <div class="topbar">
        <div>
          <div class="slideTitle" id="slideTitle"></div>
          <div class="slideNo" id="slideNo"></div>
        </div>
        <div class="btnRow">
          <button id="moveUpMain">↑上へ</button>
          <button id="moveDownMain">↓下へ</button>
        </div>
      </div>
      <div class="slideImgArea">
        <div class="slideFrame"><img id="slideImage" alt="slide" /></div>
      </div>
    </section>

    <section class="panel scriptPanel">
      <div class="scriptTop">
        <div class="tiny">PCのChrome / Edge向け。編集内容はブラウザ内に保存し、必要に応じてJSONファイルにも保存できます。</div>
        <div class="btnRow">
          <button class="secondary" id="testBtn">音声テスト</button>
          <button class="stop" id="stopBtnTop">停止</button>
          <button class="ok" id="saveNowBtn">今すぐ保存</button>
        </div>
      </div>
      <div class="saveStatus" id="saveStatus">保存準備中です。</div>

      <label for="enText">English narration <span class="tiny">編集すると自動保存</span></label>
      <textarea id="enText" spellcheck="false"></textarea>
      <div class="btnRow" style="padding:6px 8px 2px;">
        <button class="primary" id="speakEnBtn">Englishを読む</button>
        <button class="stop" id="stopBtn1">停止</button>
        <button id="copyEnBtn">Englishコピー</button>
      </div>

      <label for="jaText">日本語メモ <span class="tiny">音声入力→英訳も可</span></label>
      <textarea id="jaText" spellcheck="false"></textarea>
      <div class="btnRow" style="padding:6px 8px 2px;">
        <button class="secondary" id="speakJaBtn">日本語を読む</button>
        <button class="warn" id="dictateBtn">日本語音声入力</button>
        <button class="ok" id="translateBtn">英訳→English欄</button>
        <button class="stop" id="stopBtn2">停止</button>
        <label class="checkLabel"><input id="replaceEnglish" type="checkbox" checked /> 英語欄を上書き</label>
      </div>

      <div class="translateSettings">
        <div>
          <div class="tiny">翻訳API URL（任意。Google Apps Script等）</div>
          <input id="translationEndpoint" type="url" placeholder="https://script.google.com/macros/s/.../exec" />
        </div>
        <button id="saveSettingsBtn">設定保存</button>
      </div>

      <div class="voiceSettings">
        <div>
          <div class="tiny">English voice</div>
          <select id="enVoice"></select>
        </div>
        <div>
          <div class="tiny">日本語 voice</div>
          <select id="jaVoice"></select>
        </div>
        <div>
          <div class="tiny">Speed <span id="rateView">0.78</span></div>
          <input id="rate" type="range" min="0.55" max="1.05" step="0.01" value="0.78" />
        </div>
        <div>
          <div class="tiny">Pitch <span id="pitchView">1.00</span></div>
          <input id="pitch" type="range" min="0.75" max="1.25" step="0.01" value="1.00" />
        </div>
      </div>
      <div class="status" id="status">準備中です。まず「音声テスト」を押して音が出るか確認してください。</div>
    </section>
  </main>

<script>
const DEFAULT_SLIDES = [
  {
    "no": 1,
    "title": "Opening / Title",
    "image": "slides/slide-01.png",
    "english": "Hello everyone.

My name is ○○ from JAIST.

Today, I would like to share my study about generative AI in art education.

My main message is simple.

Non-selected images are learning traces.

Today, I focus on what happens before the final image is chosen.",
    "japanese": "最初のあいさつです。生成AIを活用した美術教育について話し、中心メッセージは『選ばれなかった画像は学びの記録である』と伝えます。",
    "id": "slide-01"
  },
  {
    "no": 2,
    "title": "ART 5.0",
    "image": "slides/slide-02.png",
    "english": "First, I would like to explain ART 5.0.

ART 5.0 is my way of describing the history of art tools.

ART 1.0 used hands.

ART 2.0 used brushes.

ART 3.0 used cameras.

ART 4.0 used computers.

And now, ART 5.0 uses generative AI.

As tools change, artistic values also change.

Today, we are living in the age of generative AI.",
    "japanese": "ART 5.0の説明です。手、筆、カメラ、コンピュータ、生成AIへと道具が変化し、それに伴って美術の価値も変わると説明します。",
    "id": "slide-02"
  },
  {
    "no": 3,
    "title": "Three gaps",
    "image": "slides/slide-03.png",
    "english": "In this new situation, students face generative AI during art making.

And students often face three kinds of gaps.

The first is Cognitive Gap.

The second is Affective Gap.

The third is Participatory Gap.

Students move back and forth through these gaps while creating images.",
    "japanese": "生成AI時代に、生徒は3つのギャップに直面することを説明します。Cognitive Gap、Affective Gap、Participatory Gapです。",
    "id": "slide-03"
  },
  {
    "no": 4,
    "title": "CSRI process",
    "image": "slides/slide-04.png",
    "english": "At the same time, students go through the CSRI process.

CSRI means Compare, Select, Review, and Iterate.

Students compare images.

They select one.

They review their choices.

Then they revise and try again.

This cycle happens repeatedly during image generation.",
    "japanese": "生徒はCSRIプロセスを通ると説明します。Compare、Select、Review、Iterateを短く説明します。",
    "id": "slide-04"
  },
  {
    "no": 5,
    "title": "Canva demonstration",
    "image": "slides/slide-05.png",
    "english": "Now, please watch this short Canva demonstration.

This video shows how students generate images, compare options, choose one image, review it, and revise their prompts.

While you watch, please pay attention to the decisions students make.

[Canva Demonstration]",
    "japanese": "Canvaデモに入る場面です。生徒が画像を生成し、比較し、選択し、振り返り、プロンプトを修正するところを見るよう促します。",
    "id": "slide-05"
  },
  {
    "no": 6,
    "title": "Research question",
    "image": "slides/slide-06.png",
    "english": "After watching the demonstration, let me explain the question behind this study.

Usually, we focus on the final image.

However, I became interested in something different.

I became interested in the image that was not selected.

My question was simple.

Why was this image not chosen?",
    "japanese": "デモの後、研究の問いを説明します。最終画像ではなく、選ばれなかった画像に注目した理由を話します。",
    "id": "slide-06"
  },
  {
    "no": 7,
    "title": "Non-selected image",
    "image": "slides/slide-07.png",
    "english": "This image is a generative AI image created by a student.

However, the student did not select it.

The student described the image as

heavy,

too dark,

and too busy.

These are short comments.

But they tell us something important.",
    "japanese": "これは生徒が作った生成AI画像ですが、選ばれませんでした。重い、暗すぎる、ごちゃごちゃしている、という言葉を紹介します。",
    "id": "slide-07"
  },
  {
    "no": 8,
    "title": "Hidden criteria",
    "image": "slides/slide-08.png",
    "english": "These comments reveal the student's hidden criteria.

The student wanted something brighter.

The student wanted something clearer.

The student wanted something closer to the original intention.

In other words, the non-selected image helped reveal the student's evaluative thinking.",
    "japanese": "短いコメントから、生徒の隠れた評価基準が見えることを説明します。明るさ、分かりやすさ、意図との近さです。",
    "id": "slide-08"
  },
  {
    "no": 9,
    "title": "Process traces",
    "image": "slides/slide-09.png",
    "english": "This is why I focus on process traces.

Process traces include prompts, generated images, choices, review comments, and revisions.

These traces naturally remain during classroom activities.

They are not extra tests.

They are part of the creative process itself.",
    "japanese": "プロセス痕跡に注目する理由です。プロンプト、生成画像、選択、レビューコメント、修正は授業の中に自然に残る記録です。",
    "id": "slide-09"
  },
  {
    "no": 10,
    "title": "Problem",
    "image": "slides/slide-10.png",
    "english": "A final image may look successful.

However, the thinking process can become invisible.

If we only look at the final image, we may miss important learning.

Therefore, I focus on what happens before the final image.",
    "japanese": "最終画像だけでは思考過程が見えにくいという問題を説明します。",
    "id": "slide-10"
  },
  {
    "no": 11,
    "title": "Core message",
    "image": "slides/slide-11.png",
    "english": "My core message is this.

Non-selected images are not failed images.

They are learning traces.

They help us understand what students rejected, what they valued, and how their ideas changed.",
    "japanese": "中心メッセージをもう一度述べます。選ばれなかった画像は失敗ではなく、学びの記録です。",
    "id": "slide-11"
  },
  {
    "no": 12,
    "title": "CSRI as segmentation",
    "image": "slides/slide-12.png",
    "english": "To analyze these traces, I use CSRI.

CSRI helps me describe what happened.

It shows where students compared, selected, reviewed, and iterated.

In this study, CSRI is used as a unit of segmentation.",
    "japanese": "CSRIを分析の区切りとして使うことを説明します。何が起きたかを見るための枠組みです。",
    "id": "slide-12"
  },
  {
    "no": 13,
    "title": "CAPGAP as interpretation",
    "image": "slides/slide-13.png",
    "english": "Next, I use CAPGAP.

CAPGAP helps explain why students changed direction.

Cognitive Gap explains mismatches in meaning or structure.

Affective Gap explains feelings such as heavy or not right.

Participatory Gap explains changes influenced by AI, peers, or teachers.",
    "japanese": "CAPGAPを解釈の枠組みとして使うことを説明します。なぜ方向が変わったかを見るためです。",
    "id": "slide-13"
  },
  {
    "no": 14,
    "title": "Framework recap",
    "image": "slides/slide-14.png",
    "english": "Therefore, CSRI and CAPGAP have different roles.

CSRI tells us what happened.

CAPGAP tells us why it happened.

CSRI is segmentation.

CAPGAP is interpretation.",
    "japanese": "CSRIとCAPGAPの役割分担をまとめます。CSRIは構造、CAPGAPは解釈です。",
    "id": "slide-14"
  },
  {
    "no": 15,
    "title": "Classroom context",
    "image": "slides/slide-15.png",
    "english": "The study took place in a regular lower-secondary art class.

Students used Canva for Education.

The AI activity lasted about thirty minutes within a fifty-minute lesson.

This was a normal classroom activity.",
    "japanese": "授業の文脈です。中学校美術の通常授業で、Canva for Educationを使ったことを説明します。",
    "id": "slide-15"
  },
  {
    "no": 16,
    "title": "Data",
    "image": "slides/slide-16.png",
    "english": "The data included prompts, generated images, choices, review notes, and revisions.

These naturally remaining traces became evidence of students' evaluative decisions.",
    "japanese": "データについて説明します。自然に残る記録が、生徒の評価的意思決定の証拠になります。",
    "id": "slide-16"
  },
  {
    "no": 17,
    "title": "Analysis",
    "image": "slides/slide-17.png",
    "english": "The analysis had two stages.

First, I segmented the process using CSRI.

Second, I interpreted the changes using CAPGAP.

This separation helped distinguish structure from meaning.",
    "japanese": "分析は2段階です。CSRIで区切り、CAPGAPで意味づけます。",
    "id": "slide-17"
  },
  {
    "no": 18,
    "title": "Results guide",
    "image": "slides/slide-18.png",
    "english": "Now, let me show the results.

The graph separates review notes from visible iteration.

The horizontal axis shows review notes.

The vertical axis shows iteration.",
    "japanese": "結果のグラフの読み方を説明します。横軸がレビュー、縦軸が反復です。",
    "id": "slide-18"
  },
  {
    "no": 19,
    "title": "Results",
    "image": "slides/slide-19.png",
    "english": "The results show that many students revised their work without writing review notes.

Fifty-five students iterated.

Only twenty-one students wrote review notes.

This suggests that decision-making is not always expressed through words.",
    "japanese": "結果の要点です。多くの生徒はレビューを書かなくても修正していました。意思決定は必ずしも言葉で表されるとは限りません。",

  },
  {
    "no": 20,
    "title": "Case 1: non-selected image",
    "image": "slides/slide-20.png",
    "english": "Here is one example.

This is the non-selected image.

The student described it as heavy, too dark, and too busy.

These comments indicate an Affective Gap.",
    "japanese": "事例1です。選ばれなかった画像と、重い、暗い、ごちゃごちゃしているという感情的な反応を説明します。",

  },
  {
    "no": 21,
    "title": "Case 1: selected image",
    "image": "slides/slide-21.png",

Compared with the previous image, it is brighter, clearer, and closer to the student's intention.

By comparing these two images, we can see the student's evaluative criteria becoming visible.",
    "japanese": "選ばれた画像を説明します。選ばれなかった画像と比べることで評価基準が見えてきます。",
    "id": "slide-21"
  },
  {
    "no": 22,
    "title": "Case 2: participatory change",
    "image": "slides/slide-22.png",
    "english": "In another case, the direction changed through interaction.

AI suggested possibilities.

Peers contributed ideas.

    "japanese": "事例2です。AI、友人、教師との関わりによって方向が変わることを説明します。",
    "id": "slide-22"
  },
  {
    "no": 23,
    "title": "Revisit framework",
    "image": "slides/slide-23.png",
    "english": "Now we can return to the framework.

ART 5.0 explains the educational context.

CSRI explains the process structure.

  },
  {
    "no": 24,
    "title": "Conclusion",
    "image": "slides/slide-24.png",
    "english": "In conclusion, final products are important.

However, they are not enough.

Final products show what was made.

Process traces show how it was chosen.

This perspective may support formative assessment in generative AI-supported art education.",
    "japanese": "結論です。最終作品は重要ですが、それだけでは十分ではありません。プロセス痕跡が形成的評価を支える可能性があります。",
    "id": "slide-24"
  },
  {
    "no": 25,
    "title": "Thank you",
    "image": "slides/slide-25.png",
    "english": "Thank you very much.

I would like to finish with my main message.

Non-selected images are learning traces.

They are not failed images.

They help us understand students' thinking before the final image.

Thank you.",
    "japanese": "最後のあいさつです。選ばれなかった画像は学びの記録である、という中心メッセージをもう一度伝えます。",
    "id": "slide-25"
  }
];

const STORAGE_KEY = 'waie_practice_slides_v3';
const SETTINGS_KEY = 'waie_practice_settings_v3';
const DB_NAME = 'waie_practice_persistent_db_v3';
const DB_STORE = 'kv';
let slides = cloneDefaultSlides();
let current = 0;
let voices = [];
let speaking = false;
let currentUtterance = null;
let saveTimer = null;
let lastSavedAt = null;
let dbPromise = null;
let recognizing = false;
let recognition = null;

const $ = (id) => document.getElementById(id);
function cloneDefaultSlides() { return JSON.parse(JSON.stringify(DEFAULT_SLIDES)); }
function setStatus(msg) { $('status').textContent = msg; }
function setSaveStatus(msg) { $('saveStatus').textContent = msg; }
function validSlides(data) {
  return Array.isArray(data) && data.length > 0 && data.every(s => s && s.image && typeof s.english === 'string' && typeof s.japanese === 'string');
}
function normalizePayload(data) {
  if (validSlides(data)) return { version: 1, slides: data, savedAt: null };
  if (data && validSlides(data.slides)) return data;
  return null;
}
function openDB() {
  if (!('indexedDB' in window)) return Promise.resolve(null);
  if (dbPromise) return dbPromise;
  dbPromise = new Promise((resolve) => {
    const req = indexedDB.open(DB_NAME, 1);
    req.onupgradeneeded = () => req.result.createObjectStore(DB_STORE);
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => resolve(null);
  });
  return dbPromise;
}
async function idbGet(key) {
  const db = await openDB();
  if (!db) return null;
  return new Promise((resolve) => {
    const tx = db.transaction(DB_STORE, 'readonly');
    const req = tx.objectStore(DB_STORE).get(key);
    req.onsuccess = () => resolve(req.result || null);
    req.onerror = () => resolve(null);
  });
}
async function idbSet(key, value) {
  const db = await openDB();
  if (!db) return false;
  return new Promise((resolve) => {
    const tx = db.transaction(DB_STORE, 'readwrite');
    tx.objectStore(DB_STORE).put(value, key);
    tx.oncomplete = () => resolve(true);
    tx.onerror = () => resolve(false);
  });
}
async function idbDelete(key) {
  const db = await openDB();
  if (!db) return false;
  return new Promise((resolve) => {
    const tx = db.transaction(DB_STORE, 'readwrite');
    tx.objectStore(DB_STORE).delete(key);
    tx.oncomplete = () => resolve(true);
    tx.onerror = () => resolve(false);
  });
}
async function loadPersistentSlides() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const payload = normalizePayload(JSON.parse(raw));
      if (payload) return payload;
    }
  } catch(e) {}
  const idbPayload = normalizePayload(await idbGet('slides'));
  if (idbPayload) return idbPayload;
  return null;
}
function getCurrentPayload() {
  return { version: 2, savedAt: new Date().toISOString(), slides };
}
function saveCurrentTextNoQueue() {
  if (!slides[current]) return;
  $('enText') && (slides[current].english = $('enText').value);
  $('jaText') && (slides[current].japanese = $('jaText').value);
}
function queueSave(reason = 'auto') {
  saveCurrentTextNoQueue();
  clearTimeout(saveTimer);
  setSaveStatus('編集中です。まもなく自動保存します…');
  saveTimer = setTimeout(() => saveNow(reason), 450);
}
async function saveNow(reason = 'manual') {
  saveCurrentTextNoQueue();
  const payload = getCurrentPayload();
  let okLocal = false;
  let okIDB = false;
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(payload));
    okLocal = true;
  } catch(e) {}
  try { okIDB = await idbSet('slides', payload); } catch(e) {}
  lastSavedAt = new Date();
  const parts = [];
  if (okLocal) parts.push('ブラウザ保存');
  if (okIDB) parts.push('予備保存');
  setSaveStatus((parts.length ? parts.join('＋') : '保存に失敗') + '：' + lastSavedAt.toLocaleTimeString() + '　※別PCでも使う場合は「書出」でJSONを保存してください。');
  return okLocal || okIDB;
}
function saveSettings() {
  const settings = {
    translationEndpoint: $('translationEndpoint').value.trim(),
    replaceEnglish: $('replaceEnglish').checked,
    rate: $('rate').value,
    pitch: $('pitch').value,
    enVoice: $('enVoice').value,
    jaVoice: $('jaVoice').value
  };
  try { localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings)); } catch(e) {}
  idbSet('settings', settings);
  setStatus('設定を保存しました。');
}
async function loadSettings() {
  let settings = null;
  try { settings = JSON.parse(localStorage.getItem(SETTINGS_KEY) || 'null'); } catch(e) {}
  if (!settings) settings = await idbGet('settings');
  if (!settings) return;
  if (settings.translationEndpoint) $('translationEndpoint').value = settings.translationEndpoint;
  if (typeof settings.replaceEnglish === 'boolean') $('replaceEnglish').checked = settings.replaceEnglish;
  if (settings.rate) { $('rate').value = settings.rate; $('rateView').textContent = settings.rate; }
  if (settings.pitch) { $('pitch').value = settings.pitch; $('pitchView').textContent = settings.pitch; }
  setTimeout(() => {
    if (settings.enVoice) $('enVoice').value = settings.enVoice;
    if (settings.jaVoice) $('jaVoice').value = settings.jaVoice;
  }, 700);
}
function escapeHtml(text) {
  return String(text).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
}
function displayNumber(idx) { return String(idx + 1).padStart(2, '0'); }
function originalNumber(s) { return String(s.no || '?').padStart(2, '0'); }

function buildNav() {
  const nav = $('slideNav');
  nav.innerHTML = '';
  slides.forEach((s, idx) => {
    const row = document.createElement('div');
    row.className = 'navItem' + (idx === current ? ' active' : '');
    const select = document.createElement('button');
    select.className = 'navSelect';
    select.innerHTML = '<span class="navTitle"><strong>' + displayNumber(idx) + '</strong> ' + escapeHtml(s.title || 'Slide') + '</span><span class="tiny">元 ' + originalNumber(s) + '</span>';
    select.onclick = () => selectSlide(idx);
    const up = document.createElement('button');
    up.className = 'miniBtn';
    up.textContent = '↑';
    up.disabled = idx === 0;
    up.onclick = (ev) => { ev.stopPropagation(); moveSlide(idx, idx - 1); };
    const down = document.createElement('button');
    down.className = 'miniBtn';
    down.textContent = '↓';
    down.disabled = idx === slides.length - 1;
    down.onclick = (ev) => { ev.stopPropagation(); moveSlide(idx, idx + 1); };
    row.appendChild(select); row.appendChild(up); row.appendChild(down);
    nav.appendChild(row);
  });
  $('moveUpMain').disabled = current <= 0;
  $('moveDownMain').disabled = current >= slides.length - 1;
}
function selectSlide(idx) {
  saveCurrentTextNoQueue();
  current = Math.max(0, Math.min(idx, slides.length - 1));
  const s = slides[current];
  $('slideTitle').textContent = s.title || 'Slide';
  $('slideNo').textContent = 'Now ' + displayNumber(current) + ' / ' + slides.length + '　元のスライド: ' + originalNumber(s);
  $('slideImage').src = s.image;
  $('enText').value = s.english || '';
  $('jaText').value = s.japanese || '';
  buildNav();
  stopSpeech(false);
}
function moveSlide(from, to) {
  if (to < 0 || to >= slides.length || from === to) return;
  saveCurrentTextNoQueue();
  const moving = slides.splice(from, 1)[0];
  slides.splice(to, 0, moving);
  current = to;
  selectSlide(current);
  queueSave('move');
  setStatus('スライド・英語・日本語をセットで移動しました。');
}
async function resetAll() {
  if (!confirm('初期状態に戻しますか？ 編集した英語・日本語と並び順は消えます。')) return;
  localStorage.removeItem(STORAGE_KEY);
  await idbDelete('slides');
  slides = cloneDefaultSlides();
  current = 0;
  selectSlide(0);
  await saveNow('reset');
  setStatus('初期状態に戻しました。');
}
function exportData() {
  saveCurrentTextNoQueue();
  const payload = getCurrentPayload();
  const blob = new Blob([JSON.stringify(payload, null, 2)], {type: 'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'waie_morning_flow_scenario.json';
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
  setStatus('台本データを書き出しました。別PCに移すときや、保存が心配なときのバックアップになります。');
}
function importData(file) {
  if (!file) return;
  const reader = new FileReader();
  reader.onload = async () => {
    try {
      const payload = normalizePayload(JSON.parse(reader.result));
      if (!payload) throw new Error('format');
      slides = payload.slides;
      current = 0;
      selectSlide(0);
      await saveNow('import');
      setStatus('台本データを読み込み、保存しました。');
    } catch(e) { setStatus('読み込みできませんでした。JSON形式を確認してください。'); }
  };
  reader.readAsText(file, 'utf-8');
}

function loadVoices() {
  if (!('speechSynthesis' in window)) {
    setStatus('このブラウザは音声読み上げに対応していません。ChromeまたはEdgeで開いてください。');
    return [];
  }
  voices = window.speechSynthesis.getVoices() || [];
  const en = $('enVoice');
  const ja = $('jaVoice');
  const oldEn = en.value;
  const oldJa = ja.value;
  en.innerHTML = '';
  ja.innerHTML = '';
  const enVoices = voices.filter(v => /^en/i.test(v.lang));
  const jaVoices = voices.filter(v => /^ja/i.test(v.lang));
  enVoices.forEach(v => en.appendChild(new Option(v.name + ' (' + v.lang + ')', v.name)));
  jaVoices.forEach(v => ja.appendChild(new Option(v.name + ' (' + v.lang + ')', v.name)));
  if (!en.children.length) en.appendChild(new Option('Default English voice', ''));
  if (!ja.children.length) ja.appendChild(new Option('Default Japanese voice', ''));
  const bestEn = enVoices.find(v => /Microsoft|Natural|Google US English|Samantha|English/i.test(v.name)) || enVoices[0];
  const bestJa = jaVoices.find(v => /Microsoft|Nanami|Haruka|Kyoko|Google|日本|Japanese/i.test(v.name)) || jaVoices[0];
  if (oldEn) en.value = oldEn; else if (bestEn) en.value = bestEn.name;
  if (oldJa) ja.value = oldJa; else if (bestJa) ja.value = bestJa.name;
  return voices;
}
function pickVoice(lang) {
  loadVoices();
  const selected = lang === 'ja-JP' ? $('jaVoice').value : $('enVoice').value;
  return voices.find(v => v.name === selected) || voices.find(v => v.lang === lang) || voices.find(v => v.lang && v.lang.toLowerCase().startsWith(lang.slice(0,2).toLowerCase())) || null;
}
function makeChunks(text, maxLen = 86) {
  const clean = String(text || '').replace(/\s+/g, ' ').trim();
  if (!clean) return [];
  const sentences = clean.match(/[^.!?。！？]+[.!?。！？]?/g) || [clean];
  const chunks = [];
  for (const sentence of sentences) {
    let s = sentence.trim();
    if (!s) continue;
    while (s.length > maxLen) {
      let cut = s.lastIndexOf(',', maxLen);
      if (cut < 40) cut = s.lastIndexOf(' ', maxLen);
      if (cut < 40) cut = maxLen;
      chunks.push(s.slice(0, cut).trim());
      s = s.slice(cut).trim();
    }
    if (s) chunks.push(s);
  }
  return chunks;
}
function stopSpeech(updateStatus = true) {
  speaking = false;
  currentUtterance = null;
  if ('speechSynthesis' in window) {
    try { window.speechSynthesis.cancel(); } catch(e) {}
  }
  if (updateStatus) setStatus('停止しました。');
}
function speakText(text, lang) {
  if (!('speechSynthesis' in window)) {
    setStatus('音声読み上げが使えません。PCのChromeまたはEdgeで開いてください。');
    return;
  }
  stopSpeech(false);
  loadVoices();
  const chunks = makeChunks(text, lang === 'en-US' ? 82 : 70);
  if (!chunks.length) { setStatus('読む文字がありません。'); return; }
  const rate = Number($('rate').value || 0.78);
  const pitch = Number($('pitch').value || 1.0);
  const voice = pickVoice(lang);
  let i = 0;
  speaking = true;
  setStatus('読み上げ中です。短く区切って読むので、途中で切れにくくしています。');
  function next() {
    if (!speaking) return;
    if (i >= chunks.length) {
      speaking = false;
      currentUtterance = null;
      setStatus('読み上げが終わりました。');
      return;
    }
    const u = new SpeechSynthesisUtterance(chunks[i]);
    currentUtterance = u;
    u.lang = lang;
    u.rate = rate;
    u.pitch = pitch;
    if (voice) u.voice = voice;
    const partNo = i + 1;
    i += 1;
    u.onstart = () => setStatus('読み上げ中 ' + partNo + ' / ' + chunks.length);
    u.onend = () => setTimeout(next, 90);
    u.onerror = (e) => {
      if (!speaking) return;
      setStatus('音声が一度止まりました。もう一度「読む」を押してください。エラー: ' + (e.error || 'unknown'));
      speaking = false;
    };
    window.speechSynthesis.speak(u);
    setTimeout(() => { try { window.speechSynthesis.resume(); } catch(e) {} }, 200);
  }
  next();
}
async function copyEnglish() {
  saveCurrentTextNoQueue();
  try {
    await navigator.clipboard.writeText($('enText').value);
    setStatus('Englishをコピーしました。');
  } catch(e) {
    $('enText').select();
    document.execCommand('copy');
    setStatus('Englishをコピーしました。');
  }
}
function startDictation() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) {
    setStatus('このブラウザでは音声入力が使えません。PC版ChromeまたはEdgeで試してください。');
    return;
  }
  if (recognizing) {
    recognition.stop();
    return;
  }
  recognition = new SR();
  recognition.lang = 'ja-JP';
  recognition.continuous = true;
  recognition.interimResults = true;
  recognizing = true;
  $('dictateBtn').textContent = '音声入力停止';
  $('dictateBtn').classList.remove('warn');
  $('dictateBtn').classList.add('stop');
  let baseText = $('jaText').value.trim();
  recognition.onresult = (event) => {
    let finalText = '';
    let interimText = '';
    for (let i = event.resultIndex; i < event.results.length; i++) {
      const t = event.results[i][0].transcript;
      if (event.results[i].isFinal) finalText += t;
      else interimText += t;
    }
    if (finalText) {
      baseText = (baseText ? baseText + '\n' : '') + finalText.trim();
      $('jaText').value = baseText;
      queueSave('dictation');
    }
    if (interimText) setStatus('音声入力中：' + interimText);
  };
  recognition.onerror = (e) => setStatus('音声入力エラー：' + (e.error || 'unknown'));
  recognition.onend = () => {
    recognizing = false;
    $('dictateBtn').textContent = '日本語音声入力';
    $('dictateBtn').classList.add('warn');
    $('dictateBtn').classList.remove('stop');
    setStatus('音声入力を停止しました。必要なら「英訳→English欄」を押してください。');
  };
  recognition.start();
  setStatus('日本語音声入力を開始しました。話した内容は日本語メモに入ります。');
}
async function translateJaToEnglish() {
  const text = $('jaText').value.trim();
  if (!text) { setStatus('日本語メモが空です。先に日本語を入力してください。'); return; }
  const endpoint = $('translationEndpoint').value.trim();
  if (!endpoint) {
    const prompt = 'Please translate the following Japanese presentation script into simple, natural English for an academic presentation. Keep key terms such as CSRI, CAPGAP, ART 5.0, process traces, and non-selected images.\n\n' + text;
    try {
      await navigator.clipboard.writeText(prompt);
      setStatus('翻訳API URLが未設定です。代わりに、ChatGPTへ貼る英訳プロンプトをコピーしました。ChatGPTに貼って英訳し、English欄へ貼り付けてください。');
    } catch(e) {
      setStatus('翻訳API URLが未設定です。自動英訳にはGoogle Apps Scriptなどの翻訳API URLが必要です。');
    }
    return;
  }
  let translation = '';
  setStatus('英訳中です。');
  try {
    const res = await fetch(endpoint, {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ text, source: 'ja', target: 'en' })
    });
    if (!res.ok) throw new Error('API status ' + res.status);
    const data = await res.json();
    translation = data.translation || data.translatedText || data.text || '';
    if (!translation) throw new Error('empty translation');
    if ($('replaceEnglish').checked) {
      $('enText').value = translation;
    } else {
      $('enText').value = ($('enText').value.trim() ? $('enText').value.trim() + '\n\n' : '') + translation;
    }
    queueSave('translation');
    setStatus('英訳しました。必要に応じてEnglish欄を整えてください。');
  } catch(e) {
    setStatus('英訳に失敗しました。翻訳API URLやネット接続を確認してください。API未設定の場合は、URL欄を空にしてもう一度押すとChatGPT用プロンプトをコピーします。');
  }
}
function attachEvents() {
  $('testBtn').onclick = () => speakText('Hello. This is a voice test. If you can hear this, the app is ready.', 'en-US');
  $('speakEnBtn').onclick = () => { saveCurrentTextNoQueue(); speakText($('enText').value, 'en-US'); };
  $('speakJaBtn').onclick = () => { saveCurrentTextNoQueue(); speakText($('jaText').value, 'ja-JP'); };
  $('stopBtnTop').onclick = () => stopSpeech(true);
  $('stopBtn1').onclick = () => stopSpeech(true);
  $('stopBtn2').onclick = () => stopSpeech(true);
  $('copyEnBtn').onclick = copyEnglish;
  $('moveUpMain').onclick = () => moveSlide(current, current - 1);
  $('moveDownMain').onclick = () => moveSlide(current, current + 1);
  $('resetBtn').onclick = resetAll;
  $('exportBtn').onclick = exportData;
  $('importBtn').onclick = () => $('importFile').click();
  $('saveNowBtn').onclick = () => saveNow('manual');
  $('importFile').onchange = (e) => importData(e.target.files[0]);
  $('enText').addEventListener('input', () => queueSave('edit-en'));
  $('jaText').addEventListener('input', () => queueSave('edit-ja'));
  $('rate').oninput = () => { $('rateView').textContent = $('rate').value; saveSettings(); };
  $('pitch').oninput = () => { $('pitchView').textContent = $('pitch').value; saveSettings(); };
  $('enVoice').onchange = saveSettings;
  $('jaVoice').onchange = saveSettings;
  $('translationEndpoint').onchange = saveSettings;
  $('replaceEnglish').onchange = saveSettings;
  $('saveSettingsBtn').onclick = saveSettings;
  $('dictateBtn').onclick = startDictation;
  $('translateBtn').onclick = translateJaToEnglish;
  window.addEventListener('beforeunload', () => {
    saveCurrentTextNoQueue();
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(getCurrentPayload())); } catch(e) {}
  });
}
async function init() {
  attachEvents();
  if ('speechSynthesis' in window) {
    loadVoices();
    window.speechSynthesis.onvoiceschanged = () => { loadVoices(); };
    setTimeout(loadVoices, 300);
    setTimeout(loadVoices, 1000);
  }
  await loadSettings();
  const payload = await loadPersistentSlides();
  if (payload && validSlides(payload.slides)) {
    slides = payload.slides;
    setSaveStatus('保存済みデータを読み込みました。最終保存: ' + (payload.savedAt ? new Date(payload.savedAt).toLocaleString() : '不明'));
  } else {
    slides = cloneDefaultSlides();
    setSaveStatus('初期台本を読み込みました。編集後は自動保存されます。');
    await saveNow('initial');
  }
  selectSlide(0);
  const protocolHint = location.protocol === 'file:' ? '現在 file:// で開いています。保存が不安定な場合は、毎回同じ index.html から開き、必要に応じて「書出」でJSONバックアップを残してください。' : 'このURLで開く限り、自動保存は次回起動時にも残ります。';
  setStatus('準備できました。' + protocolHint);
}
init();

if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').then(reg => reg.update()).catch(() => {});
  });
}
