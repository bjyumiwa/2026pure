<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WAIE Voice Practice App</title>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <style>
    :root {
      --bg:#fff7fb; --panel:#ffffff; --ink:#222; --muted:#666; --pink:#e86aa4; --pink2:#ffd9ea;
      --mint:#d9f4ee; --yellow:#fff4bf; --blue:#dfeeff; --shadow:0 10px 30px rgba(120, 70, 100, .15);
    }
    * { box-sizing:border-box; }
    body { margin:0; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background:var(--bg); color:var(--ink); }
    header { padding:18px 22px; background:linear-gradient(90deg,#ffe5f1,#fff7fb); border-bottom:1px solid #f3c5dc; }
    h1 { margin:0; font-size:22px; }
    .sub { color:var(--muted); margin-top:4px; font-size:14px; }
    main { display:grid; grid-template-columns: 290px 1fr; gap:16px; padding:16px; min-height:calc(100vh - 80px); }
    .card { background:var(--panel); border-radius:18px; box-shadow:var(--shadow); padding:14px; }
    .slideList { max-height:calc(100vh - 140px); overflow:auto; }
    .slideBtn { display:block; width:100%; border:1px solid #f2c8da; background:#fff; border-radius:12px; padding:10px; margin-bottom:8px; text-align:left; cursor:pointer; }
    .slideBtn.active { background:var(--pink2); border-color:var(--pink); font-weight:700; }
    .small { color:var(--muted); font-size:12px; }
    .grid { display:grid; grid-template-columns: 1fr 1fr; gap:14px; }
    label { font-weight:700; display:block; margin:12px 0 6px; }
    textarea { width:100%; min-height:150px; border:1px solid #e7bfd2; border-radius:14px; padding:12px; font-size:16px; line-height:1.5; resize:vertical; }
    select,input[type=range] { width:100%; }
    button { border:0; border-radius:14px; padding:10px 14px; background:var(--pink); color:white; font-weight:700; cursor:pointer; margin:4px 4px 4px 0; }
    button.secondary { background:#666; }
    button.light { background:#fff; color:#b33d73; border:1px solid #f1bad4; }
    button.mint { background:#3aa892; }
    .controls { display:flex; flex-wrap:wrap; align-items:center; gap:6px; }
    .pill { display:inline-block; background:var(--yellow); padding:4px 8px; border-radius:999px; font-size:12px; margin-left:6px; }
    .preview { max-width:100%; border-radius:14px; border:1px solid #eee; margin-top:8px; display:none; }
    .status { min-height:24px; color:#b33d73; font-weight:700; margin-top:8px; }
    .note { background:#fff7cc; border-left:5px solid #f0c84b; padding:10px; border-radius:10px; font-size:14px; }
    @media(max-width:850px) { main { grid-template-columns: 1fr; } .grid { grid-template-columns:1fr; } }
  </style>
</head>
<body>
<header>
  <h1>WAIE Voice Practice App <span class="pill">英語発表練習</span></h1>
  <div class="sub">スライドごとに英文を読み上げます。英文は自由に直せます。Edge / Chrome の音声を使います。</div>
</header>
<main>
  <aside class="card slideList" id="slideList"></aside>
  <section class="card">
    <div class="note">ポイント：流ちょうに聞かせるには、スライドの文字そのものではなく、下の「English narration」を読ませるのがおすすめです。スクリーンショットを貼った場合は、OCRで文字を取り出してから読み上げできます。</div>
    <h2 id="slideTitle">Slide</h2>
    <div class="grid">
      <div>
        <label>English narration（音声で読む文）</label>
        <textarea id="enText"></textarea>
      </div>
      <div>
        <label>日本語メモ（意味確認）</label>
        <textarea id="jaText"></textarea>
      </div>
    </div>

    <label>Voice</label>
    <select id="voiceSelect"></select>
    <div class="grid">
      <div><label>Speed: <span id="rateLabel">0.90</span></label><input id="rate" type="range" min="0.6" max="1.2" step="0.05" value="0.9"></div>
      <div><label>Pitch: <span id="pitchLabel">1.00</span></label><input id="pitch" type="range" min="0.7" max="1.3" step="0.05" value="1"></div>
    </div>
    <div class="controls">
      <button onclick="speakCurrent('en')">Englishを読む</button>
      <button class="mint" onclick="speakCurrent('both')">英語＋日本語を読む</button>
      <button class="light" onclick="speakAll()">全スライドを読む</button>
      <button class="secondary" onclick="stopSpeak()">停止</button>
      <button class="light" onclick="prevSlide()">前へ</button>
      <button class="light" onclick="nextSlide()">次へ</button>
      <button class="light" onclick="saveEdits()">編集を保存</button>
    </div>
    <div class="status" id="status"></div>

    <hr style="border:0;border-top:1px solid #f1c8da;margin:18px 0;" />
    <h3>スライド画像や文字を貼って読む</h3>
    <p class="small">画像を貼る、またはアップロードするとOCRできます。テキストだけ貼った場合は、そのまま読み上げできます。</p>
    <textarea id="pasteBox" placeholder="ここにスライドの文字を貼るか、画像をクリップボードから貼ってください。"></textarea>
    <div class="controls">
      <input type="file" id="imageInput" accept="image/*" />
      <button class="light" onclick="readPastedText()">貼った文字を読む</button>
      <button class="light" onclick="runOCR()">画像から文字を読む OCR</button>
      <button class="light" onclick="addPastedAsSlide()">新しい練習スライドに追加</button>
    </div>
    <img id="preview" class="preview" />
  </section>
</main>
<script>
const defaultSlides = [
  {
    "no": "01",
    "title": "Title",
    "en": "Hello everyone. My name is ○○. Today, I will present my study, Process-Trace Analysis of Iterative Decision-Making in Generative AI-Supported Art Education. The main message is that non-selected images are learning traces. In this talk, I focus on the decisions that happen before the final image.",
    "ja": "皆さん、こんにちは。○○です。本日は、生成AIを活用した美術教育における反復的な意思決定のプロセス分析について発表します。中心となるメッセージは、選ばれなかった画像も学びの痕跡である、ということです。最終画像の前に起きている判断に注目します。"

  {

    "en": "This research began with one unused image. In a generative AI activity, students often receive many images very quickly. I became interested not only in the image they finally chose, but also in the image they did not choose. So my first question was simple: why was this image not chosen?",
    "ja": "この研究は、使われなかった一枚の画像から始まりました。生成AIの活動では、生徒は短い時間で多くの画像を得ます。私は、最終的に選ばれた画像だけでなく、選ばれなかった画像にも関心を持ちました。そこで最初の問いは、この画像はなぜ選ばれなかったのか、というものでした。"

    "ja": "生徒の短い言葉は、とても重要でした。生徒は、その画像を、重い、暗すぎる、ごちゃごちゃしている、と説明しました。短い言葉ですが、そこには隠れた評価基準が表れています。生徒は、より明るく、より明確で、自分の意図に近い画像を探していたと考えられます。"
  },
  {
    "no": "04",
    "title": "Background",
    "en": "Generative AI has changed the speed of idea sketches. Before AI, students usually made a small number of sketches slowly. With AI, they can produce many polished options very quickly. This creates a new classroom tempo, and it also changes how students compare and judge their ideas.",
    "ja": "生成AIは、アイデアスケッチの速度を変えました。AI以前は、生徒は少数のスケッチを時間をかけて描いていました。AIを使うと、完成度の高い複数の案を短時間で得ることができます。これにより、授業のテンポが変わり、生徒がアイデアを比較し判断する方法も変わります。"
  },
  {

    "en": "Next, I will show a short video of the classroom workflow. Students open Canva for Education, generate several images, compare them, choose one, review it, and revise their prompt. Please notice that the important point is not only the final image, but the choices made along the way.",
    "ja": "次に、授業での流れを短い動画で示します。生徒はCanva for Educationを開き、複数の画像を生成し、比較し、一つを選び、確認し、プロンプトを修正します。ここで大切なのは、最終画像だけではなく、その途中で行われる選択です。"
  },
  {
    "no": "06",
    "title": "Problem",
    "en": "A final image can hide the thinking process. When we look only at the final product, it may look polished and successful. However, we cannot easily see what the student rejected, what the student changed, or why the student made that decision.",
    "ja": "最終画像だけを見ると、思考の過程が見えにくくなります。完成した作品は、整っていて成功しているように見えるかもしれません。しかし、何を選ばなかったのか、どこを変えたのか、なぜその判断をしたのかは、最終画像だけからは分かりにくいのです。"
  },
  {
    "no": "07",
    "title": "Purpose",
    "en": "Therefore, I examined the traces that remain before the final image. These traces include prompts, generated images, choices, short reasons, and revisions. I call them process traces. They help us see students' evaluative decisions during the creative process.",
    "ja": "そこで本研究では、最終画像の前に残る記録に注目しました。具体的には、プロンプト、生成画像、選択、短い理由、修正などです。これらをプロセスの痕跡として捉えます。これにより、生徒が制作過程でどのように評価し判断しているのかを見やすくします。"
  },
  {
    "no": "08",
    "title": "Core message",
    "en": "Here is the core message again. Non-selected images are not failed images. They are learning traces. They show what students rejected, what they wanted to keep, and how their criteria began to develop.",
    "ja": "ここで、もう一度中心メッセージを示します。選ばれなかった画像は、失敗した画像ではありません。それらは学びの痕跡です。生徒が何を退け、何を残したかったのか、そして評価基準がどのように生まれたのかを示しています。"
  },
  {
    "no": "09",
    "title": "Framework 1: ART 5.0",
    "en": "The first framework is ART 5.0. I use ART 5.0 to position generative AI as one art tool in a long history of tools. Art has always changed with tools, such as brushes, cameras, digital tools, and now AI. In this view, AI is not a replacement for creativity. It is a new tool that changes the process of expression.",
    "ja": "一つ目の枠組みはART 5.0です。ART 5.0は、生成AIを美術の道具の歴史の中に位置づけるために使います。美術は、筆、カメラ、デジタルツール、そしてAIのような道具とともに変化してきました。この見方では、AIは創造性の代わりではなく、表現のプロセスを変える新しい道具です。"
  },
  {
    "no": "10",
    "title": "Framework 2: CSRI",
    "en": "The second framework is C S R I. C S R I means Compare, Select, Review, and Iterate. Students compare several AI images, select one option, review the reason, and iterate by changing the prompt or direction. In this study, C S R I is used as a unit for segmenting the process.",
    "ja": "二つ目の枠組みはCSRIです。CSRIは、Compare、Select、Review、Iterateの略です。生徒は複数のAI画像を比較し、一つを選び、その理由を確認し、プロンプトや方向性を変えて反復します。本研究では、CSRIをプロセスを区切る単位として用います。"
  },
  {
    "no": "11",
    "title": "Framework 3: CAPGAP",
    "en": "The third framework is CAPGAP. CAPGAP helps interpret the mismatch behind students' decisions. A cognitive gap appears when meaning, form, or composition does not fit the student's intention. An affective gap appears when feelings, such as heavy, cute, or uncomfortable, guide the judgment. A participatory gap appears when tools, teachers, or peers influence the decision.",
    "ja": "三つ目の枠組みはCAPGAPです。CAPGAPは、生徒の判断の背後にあるズレを解釈するために用います。認知的なGapは、意味、形、構成が意図と合わないときに表れます。感情的なGapは、重い、かわいい、しっくりこない、などの感覚が判断に関わるときに表れます。参加型のGapは、ツール、教師、友人との関わりが判断に影響するときに表れます。"

    "title": "Framework recap",
    "en": "In this study, C S R I and CAPGAP have different roles. C S R I tells us what happened in the process. CAPGAP helps us explain why the direction changed. In other words, C S R I is for segmentation, and CAPGAP is for interpretation.",
    "ja": "本研究では、CSRIとCAPGAPには異なる役割があります。CSRIは、プロセスの中で何が起きたのかを示します。CAPGAPは、なぜ方向性が変わったのかを説明する助けになります。つまり、CSRIは区切るための枠組みであり、CAPGAPは解釈するための枠組みです。"
  },
  {
    "no": "13",
    "title": "Method: classroom",
    "en": "The activity took place in a regular lower-secondary art class. Students used Canva for Education during a fifty-minute lesson. About thirty minutes were used for AI image generation and selection. The activity was part of normal classroom practice, not a special laboratory setting.",
    "ja": "実践は、通常の中学校美術科の授業で行われました。生徒は50分授業の中でCanva for Educationを使用しました。およそ30分をAI画像の生成と選択に使いました。この活動は、特別な実験室ではなく、日常の授業実践の一部として行われました。"
  },
  {
    "no": "14",
    "title": "Method: data",
    "en": "The data were naturally remaining classroom traces. They included prompts, generated images, choices, and brief reasons. These were not additional tests. They were records that appeared naturally while students worked with generative AI.",
    "ja": "分析対象としたデータは、授業の中で自然に残る記録です。プロンプト、生成画像、選択、短い理由などが含まれます。これらは追加のテストではありません。生徒が生成AIを使って制作する中で自然に生じた記録です。"

    "ja": "分析は二段階で行いました。第一段階では、CSRIを用いて活動を区切りました。これにより、比較、選択、レビュー、反復がどこに現れたのかを確認しました。第二段階では、レビューの言葉や変化をCAPGAPで解釈しました。これにより、ズレの意味を説明しやすくしました。"
  },

    "no": "16",

    "ja": "対象は71名です。13名はレビュー記録も反復もありませんでした。3名はレビュー記録のみでした。37名は反復のみが見られました。18名はレビュー記録と反復の両方が見られました。全体として、55名に反復が見られましたが、レビュー記録を書いた生徒は21名でした。"

    "no": "19",

  {
    "no": "20",

  {

let slides = JSON.parse(localStorage.getItem('waieSlides') || JSON.stringify(defaultSlides));
let current = 0;
let voices = [];
let readingAll = false;
let pastedImageData = null;

function $(id) { return document.getElementById(id); }
function renderList() {
  const list = $('slideList');
  list.innerHTML = '';
  slides.forEach((s,i)=>{
    const b = document.createElement('button');
    b.className = 'slideBtn' + (i===current ? ' active':'');
    b.innerHTML = `<b>${s.no}. ${s.title}</b><div class="small">${(s.en||'').slice(0,70)}...</div>`;
    b.onclick = ()=>{ saveEdits(); current=i; loadSlide(); };
    list.appendChild(b);
  });
}
function loadSlide() {
  const s=slides[current];
  $('slideTitle').textContent = `Slide ${s.no} - ${s.title}`;
  $('enText').value = s.en || '';
  $('jaText').value = s.ja || '';
  renderList();
}
function saveEdits() {
  slides[current].en = $('enText').value;
  slides[current].ja = $('jaText').value;
  localStorage.setItem('waieSlides', JSON.stringify(slides));
  $('status').textContent='保存しました。';
  setTimeout(()=>$('status').textContent='',1200);
}
function loadVoices() {
  voices = speechSynthesis.getVoices();
  const sel=$('voiceSelect');
  const old=sel.value;
  sel.innerHTML='';
  voices.forEach((v,i)=>{
    const opt=document.createElement('option');
    opt.value=i;
    opt.textContent=`${v.name} (${v.lang})`;
    if(v.lang.startsWith('en')) opt.textContent='⭐ '+opt.textContent;
    sel.appendChild(opt);
  });
  const prefer = voices.findIndex(v => v.lang.startsWith('en') && /Natural|Online|Jenny|Aria|Sonia|Microsoft|Google/i.test(v.name));
  sel.value = old || (prefer>=0 ? prefer : 0);
}
speechSynthesis.onvoiceschanged = loadVoices;
loadVoices();
$('rate').oninput=()=>$('rateLabel').textContent=$('rate').value;
$('pitch').oninput=()=>$('pitchLabel').textContent=$('pitch').value;

function findVoiceFor(lang) {
  const primary = lang.slice(0,2).toLowerCase();
  return voices.find(v => (v.lang || '').toLowerCase().startsWith(primary)) || null;
}
function makeUtterance(text, lang='en-US', useSelected=true) {
  const u = new SpeechSynthesisUtterance(text);
  const idx = parseInt($('voiceSelect').value,10);
  if(useSelected && voices[idx]) u.voice=voices[idx];
  if(!useSelected) u.voice = findVoiceFor(lang);
  u.rate = parseFloat($('rate').value);
  u.pitch = parseFloat($('pitch').value);
  u.lang = lang;
  return u;
}
function speakText(text, lang='en-US', onend=null) {
  speechSynthesis.cancel();
  const useSelected = !lang.startsWith('ja');
  const u=makeUtterance(text,lang,useSelected);
  if(onend) u.onend=onend;
  speechSynthesis.speak(u);
}
function speakCurrent(mode='en') {
  saveEdits();
  const en=$('enText').value.trim();
  const ja=$('jaText').value.trim();
  if(mode==='both') speakText(en + '

Japanese meaning.
' + ja, 'en-US');
  else speakText(en, 'en-US');
}
function speakAll() {
  saveEdits();
  readingAll = true;
  current = 0;
  loadSlide();
  speakNextInAll();
}
function speakNextInAll() {
  if(!readingAll) return;
  if(current >= slides.length) { $('status').textContent='全スライドを読み終わりました。'; readingAll=false; return; }
  loadSlide();
  $('status').textContent = `Reading slide ${slides[current].no}...`;
  const text = slides[current].en;
  const u = makeUtterance(text, 'en-US');
  u.onend = () => { current++; setTimeout(speakNextInAll, 600); };
  speechSynthesis.cancel(); speechSynthesis.speak(u);
}
function stopSpeak() { readingAll=false; speechSynthesis.cancel(); $('status').textContent='停止しました。'; }
function nextSlide() { saveEdits(); current = Math.min(slides.length-1,current+1); loadSlide(); }
function prevSlide() { saveEdits(); current = Math.max(0,current-1); loadSlide(); }

function readPastedText() {
  const text=$('pasteBox').value.trim();
  if(!text) { $('status').textContent='読む文字がありません。'; return; }
  speakText(text, /[ぁ-んァ-ン一-龥]/.test(text) ? 'ja-JP' : 'en-US');
}
function addPastedAsSlide() {
  const text=$('pasteBox').value.trim();
  if(!text) return;
  slides.push({no:String(slides.length+1).padStart(2,'0'), title:'Pasted slide', en:text, ja:''});
  localStorage.setItem('waieSlides', JSON.stringify(slides));
  current=slides.length-1; loadSlide();
}

$('imageInput').addEventListener('change', e=>{
  const f=e.target.files[0]; if(!f) return;
  const reader=new FileReader();
  reader.onload = ev => { pastedImageData=ev.target.result; $('preview').src=pastedImageData; $('preview').style.display='block'; };
  reader.readAsDataURL(f);
});
$('pasteBox').addEventListener('paste', e=>{
  const items=e.clipboardData && e.clipboardData.items;
  if(!items) return;
  for(const item of items) {
    if(item.type.startsWith('image/')) {
      const file=item.getAsFile();
      const reader=new FileReader();
      reader.onload=ev=>{ pastedImageData=ev.target.result; $('preview').src=pastedImageData; $('preview').style.display='block'; $('status').textContent='画像を貼りました。OCRできます。'; };
      reader.readAsDataURL(file);
    }
  }
});
async function runOCR() {
  if(!pastedImageData) { $('status').textContent='先に画像を貼るかアップロードしてください。'; return; }
  if(!window.Tesseract) { $('status').textContent='OCRライブラリを読み込めませんでした。ネット接続を確認してください。'; return; }
  $('status').textContent='OCR中です。少し待ってください。';
  try {
    const result = await Tesseract.recognize(pastedImageData, 'eng+jpn', { logger:m=>{ if(m.status) $('status').textContent='OCR: '+m.status; } });
    $('pasteBox').value = result.data.text.trim();
    $('status').textContent='OCRが終わりました。必要なら文字を直して読み上げてください。';
  } catch(err) {
    console.error(err); $('status').textContent='OCRに失敗しました。画像が小さい場合は拡大して試してください。';
  }
}
loadSlide();
</script>
</body>
