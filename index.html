<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ff7ab6">
<title>WAIE 2026 Mobile Read Aloud</title>
<style>
  :root {
    --bg: #fff8fc;
    --card: #ffffff;
    --ink: #201923;
    --muted: #6f6370;
    --pink: #ec5c9e;
    --pink2: #c83279;
    --line: #efd3e3;
    --soft: #ffe6f1;
    --shadow: 0 12px 30px rgba(90, 28, 68, .14);
    --bottom: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans JP", sans-serif;
    color: var(--ink);
    background: linear-gradient(180deg, #fff2f8 0%, #fff8fc 55%, #f8f3ff 100%);
    -webkit-text-size-adjust: 100%;
  }
  .wrap {
    width: min(100%, 720px);
    margin: 0 auto;
    padding: 12px 12px calc(110px + var(--bottom));
  }
  header {
    position: sticky;
    top: 0;
    z-index: 5;
    margin: 0 -12px 10px;
    padding: 10px 12px 12px;
    background: rgba(255, 248, 252, .96);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--line);
  }
  h1 {
    margin: 0 0 8px;
    font-size: 20px;
    line-height: 1.25;
    letter-spacing: .02em;
  }
  .toprow { display: flex; gap: 8px; align-items: center; justify-content: space-between; }
  .pill {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 8px 11px;
    font-weight: 800;
    box-shadow: 0 4px 12px rgba(0,0,0,.04);
  }
  .pill small { color: var(--muted); font-weight: 700; }
  .status { color: var(--muted); font-size: 13px; white-space: nowrap; }
  .progress {
    margin-top: 9px;
    height: 10px;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: #fff;
    overflow: hidden;
  }
  .bar { height: 100%; width: 0%; background: linear-gradient(90deg, var(--pink), #8a61ff); transition: width .2s; }
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 22px;
    box-shadow: var(--shadow);
    padding: 14px;
  }
  label { display: block; margin-bottom: 6px; font-weight: 800; }
  select, textarea, button, input { font: inherit; }
  select {
    width: 100%;
    min-height: 52px;
    border-radius: 16px;
    border: 1px solid var(--line);
    background: #fff;
    padding: 0 12px;
    font-size: 17px;
  }
  .titleline { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 14px 0 8px; }
  h2 { margin: 0; font-size: 22px; line-height: 1.25; }
  .words { color: var(--muted); font-size: 13px; }
  .script {
    min-height: 42vh;
    border: 1px solid var(--line);
    border-radius: 20px;
    background: #fffdfd;
    padding: 16px;
    font-size: 20px;
    line-height: 1.72;
    overflow-wrap: anywhere;
    white-space: pre-wrap;
  }
  .script:focus { outline: 4px solid rgba(236,92,158,.16); border-color: #f09ac3; }
  .sentence { border-radius: 8px; padding: 1px 2px; }
  .sentence.now { background: #ffe0ef; box-shadow: 0 0 0 2px #ffe0ef; }
  .note { margin: 10px 2px 0; color: var(--muted); font-size: 13px; line-height: 1.55; }
  .buttons { display: grid; gap: 10px; margin-top: 12px; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  button {
    min-height: 54px;
    border: 1px solid var(--line);
    border-radius: 17px;
    background: #fff;
    color: var(--ink);
    font-weight: 850;
    box-shadow: 0 6px 14px rgba(70, 25, 55, .07);
  }
  button:active { transform: translateY(1px); }
  .mainbtn {
    min-height: 62px;
    color: #fff;
    border-color: transparent;
    background: linear-gradient(135deg, var(--pink), var(--pink2));
    font-size: 18px;
  }
  .danger { color: #a4114a; background: #fff5f8; }
  details { margin-top: 12px; }
  summary { padding: 10px 2px; font-weight: 850; color: #513245; }
  .settings { display: grid; gap: 12px; padding-top: 4px; }
  .rangeHead { display: flex; justify-content: space-between; color: var(--muted); margin-bottom: 4px; font-size: 14px; }
  input[type="range"] { width: 100%; }
  .check {
    display: flex;
    gap: 8px;
    align-items: flex-start;
    border: 1px solid var(--line);
    background: #fff;
    border-radius: 15px;
    padding: 10px;
    color: var(--muted);
    font-size: 14px;
    line-height: 1.45;
  }
  .check input { transform: scale(1.25); margin-top: 4px; }
  .bottom {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 10;
    border-top: 1px solid var(--line);
    background: rgba(255,255,255,.96);
    backdrop-filter: blur(14px);
    padding: 9px 12px calc(9px + var(--bottom));
  }
  .bottomin {
    width: min(100%, 720px);
    margin: 0 auto;
    display: grid;
    grid-template-columns: 1fr 1.35fr 1fr;
    gap: 8px;
  }
  .bottom button { min-height: 56px; padding: 8px; }
  .toast {
    position: fixed;
    left: 50%;
    bottom: calc(98px + var(--bottom));
    transform: translateX(-50%) translateY(12px);
    opacity: 0;
    background: #221b25;
    color: white;
    border-radius: 999px;
    padding: 10px 14px;
    z-index: 30;
    pointer-events: none;
    transition: .2s;
    white-space: nowrap;
    font-size: 14px;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  @media (max-width: 390px) {
    .script { font-size: 18px; }
    h1 { font-size: 18px; }
    h2 { font-size: 20px; }
    button { font-size: 15px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>WAIE 2026 読み上げ練習</h1>
    <div class="toprow">
      <div class="pill"><span id="slideNo">Slide 01</span><small id="countNo">1/13</small></div>
      <div class="status" id="status">停止中</div>
    </div>
    <div class="progress"><div class="bar" id="bar"></div></div>
  </header>

  <main class="card">
    <label for="slideSelect">スライドを選ぶ</label>
    <select id="slideSelect"></select>

    <div class="titleline">
      <h2 id="title">Opening</h2>
      <div class="words" id="words">0 words</div>
    </div>

    <div id="script" class="script" contenteditable="true" spellcheck="false" aria-label="読み上げ原稿"></div>
    <p class="note">スマホ用に、1枚ずつ大きく表示します。Slide 01〜13はすべて文章入りです。編集したら保存できます。</p>

    <div class="buttons">
      <button class="mainbtn" id="play">▶ このスライドを読む</button>
      <div class="row2">
        <button id="pause">⏸ 一時停止</button>
        <button id="resume">⏵ 再開</button>
      </div>
      <div class="row2">
        <button class="danger" id="stop">■ 停止</button>
        <button id="all">▶ 全部読む</button>
      </div>
    </div>

    <details>
      <summary>設定・保存</summary>
      <div class="settings">
        <div>
          <label for="voice">声を選ぶ</label>
          <select id="voice"></select>
        </div>
        <div>
          <div class="rangeHead"><strong>速度</strong><span id="rateLabel">0.90</span></div>
          <input id="rate" type="range" min="0.60" max="1.20" step="0.05" value="0.90">
        </div>
        <label class="check"><input id="autoNext" type="checkbox" checked> 読み終わったら自動で次のスライドへ進む</label>
        <div class="row2">
          <button id="save">保存</button>
          <button id="copy">コピー</button>
        </div>
        <button class="danger" id="reset">初期原稿に戻す</button>
        <p class="note">音が出ない時は、マナーモード解除、音量、ブラウザを確認してください。iPhoneでは最初にボタンを押してから声一覧が出ることがあります。</p>
      </div>
    </details>
  </main>
</div>

<nav class="bottom">
  <div class="bottomin">
    <button id="prev">← 前へ</button>
    <button id="bottomPlay" class="mainbtn">▶ 読む</button>
    <button id="next">次へ →</button>
  </div>
</nav>
<div class="toast" id="toast">保存しました</div>

<script>
const DEFAULT_SLIDES = [{"id": "01", "title": "Opening", "text": "Hello everyone. Thank you for joining my presentation. Today, I will talk about process-trace analysis of iterative decision-making in generative AI-supported art education."}, {"id": "02", "title": "Change in Art Education", "text": "Believe it or not, generative AI has transformed art education. Before AI, students spent more time slowly developing their ideas through sketches. With AI, students can quickly generate many polished images. This creates a new tempo in the classroom."}, {"id": "03", "title": "ART 5.0", "text": "We might be surprised by this change, but actually, this kind of transformation has happened before. In this study, we understand AI as one more tool in the history of art education. This is the first part of our research: ART 5.0."}, {"id": "04", "title": "CAPGAP", "text": "In the era of ART 5.0, students face several kinds of gaps. We call these discrepancies CAPGAP: cognitive, affective, and participatory gaps. This framework helped us trace our research focus. From there, we identified the CSRI cycle."}, {"id": "05", "title": "CSRI Cycle", "text": "C is for Compare, S is for Select, R is for Review, and I is for Iterate. These four stages help us segment the students’ decision-making flow."}, {"id": "06", "title": "Process Traces", "text": "We examined process traces before the final image. CSRI allows us to segment and observe the flow of students’ decision-making."}, {"id": "07", "title": "Demonstration", "text": "Now, let’s take a look at a short demonstration. While using Canva, students compare images, select one, review it, and try again. This is the CSRI cycle in action."}, {"id": "08", "title": "Unselected Idea Sketch", "text": "Now, let’s take a look at an idea sketch. This is actually an image that the student did not select. The reason was that it felt heavy, too dark, and a bit cluttered."}, {"id": "09", "title": "Iteration", "text": "Then, the student tried again, and this image was created. Through this interaction, the decision shifted toward a brighter and clearer image that aligned more closely with the student’s intent."}, {"id": "10", "title": "CAPGAP Example", "text": "This example can be interpreted through CAPGAP. The first image did not fully match the student’s intention. The student noticed the mismatch, reviewed the image, and decided what needed to change next."}, {"id": "11", "title": "Participatory Gap Example", "text": "This example also shows a participatory gap. The decision was shaped not only by the AI output, but also by the classroom context, teacher support, and interaction with others. CAPGAP helps us explain why the next iteration happened."}, {"id": "12", "title": "Overall Results", "text": "Here are the overall results. We analyzed 71 students. Fifty-five students revised their prompts or images. However, only 21 students wrote review notes. Interestingly, 37 students iterated without writing any review notes. This suggests that evaluative decisions may occur even when students do not explicitly record their reflections."}, {"id": "13", "title": "Conclusion", "text": "To conclude, CSRI organized students’ process traces. Unselected images and review notes made evaluative decisions visible. CAPGAP helped us interpret why students revised their ideas. Unselected images are not failures. They are learning traces."}];
const STORAGE_KEY = "waie2026_mobile_read_aloud_v3";
let slides = structuredClone(DEFAULT_SLIDES);
let current = 0;
let voices = [];
let queue = [];
let queueIndex = 0;
let readingAll = false;
let speaking = false;

const $ = id => document.getElementById(id);

function loadSaved() {
  try {
    const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || "null");
    if (Array.isArray(saved) && saved.length === DEFAULT_SLIDES.length) slides = saved;
  } catch(e) {}
}
function saveNow(show=true) {
  slides[current].text = getPlainText();
  localStorage.setItem(STORAGE_KEY, JSON.stringify(slides));
  if (show) toast("保存しました");
}
function toast(msg) {
  const t = $("toast");
  t.textContent = msg;
  t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 1500);
}
function wordCount(text) {
  const m = text.trim().match(/[A-Za-z0-9’'-]+/g);
  return m ? m.length : 0;
}
function splitSentences(text) {
  const clean = text.replace(/\s+/g, " ").trim();
  if (!clean) return [];
  const parts = clean.match(/[^.!?。！？]+[.!?。！？]+|[^.!?。！？]+$/g) || [clean];
  return parts.map(s => s.trim()).filter(Boolean);
}
function renderScript(text, activeIndex=-1) {
  const parts = splitSentences(text);
  if (!parts.length) {
    $("script").textContent = "";
    return;
  }
  $("script").innerHTML = parts.map((p,i)=>`<span class="sentence ${i===activeIndex?'now':''}" data-i="${i}">${escapeHtml(p)}</span>`).join(" ");
  const now = $("script").querySelector(".now");
  if (now) now.scrollIntoView({block:"center", behavior:"smooth"});
}
function escapeHtml(s) {
  return s.replace(/[&<>]/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[ch]));
}
function getPlainText() {
  return $("script").innerText.replace(/\s+
/g, "
").trim();
}
function renderSelect() {
  const sel = $("slideSelect");
  sel.innerHTML = slides.map((s,i)=>`<option value="${i}">Slide ${s.id}  ${s.title}</option>`).join("");
}
function render() {
  const s = slides[current];
  $("slideNo").textContent = "Slide " + s.id;
  $("countNo").textContent = (current+1) + "/" + slides.length;
  $("slideSelect").value = String(current);
  $("title").textContent = s.title;
  $("words").textContent = wordCount(s.text) + " words";
  $("bar").style.width = ((current+1)/slides.length*100) + "%";
  renderScript(s.text);
}
function setStatus(txt) { $("status").textContent = txt; }
function loadVoices() {
  voices = speechSynthesis.getVoices();
  const sel = $("voice");
  const preferred = voices.filter(v => /en|US|UK|United|Samantha|Daniel|Google/i.test(v.lang + " " + v.name));
  const list = preferred.length ? preferred : voices;
  sel.innerHTML = list.map((v, i) => `<option value="${voices.indexOf(v)}">${v.name} (${v.lang})</option>`).join("");
  const best = voices.findIndex(v => /en-US/i.test(v.lang)) >= 0 ? voices.findIndex(v => /en-US/i.test(v.lang)) : 0;
  if (best >= 0) sel.value = String(best);
}
function selectedVoice() {
  const idx = Number($("voice").value);
  return voices[idx] || voices.find(v => /en/.test(v.lang)) || null;
}
function stopSpeech() {
  speechSynthesis.cancel();
  speaking = false;
  readingAll = false;
  queue = [];
  queueIndex = 0;
  setStatus("停止中");
  renderScript(slides[current].text);
}
function speakCurrent(all=false) {
  saveNow(false);
  stopSpeech();
  readingAll = all;
  speaking = true;
  queue = splitSentences(slides[current].text);
  queueIndex = 0;
  if (!queue.length) { toast("このスライドに文章がありません"); return; }
  setStatus(all ? "全部読み上げ中" : "読み上げ中");
  speakNextSentence();
}
function speakNextSentence() {
  if (!speaking) return;
  if (queueIndex >= queue.length) {
    if ((readingAll || $("autoNext").checked) && current < slides.length - 1) {
      current += 1;
      render();
      queue = splitSentences(slides[current].text);
      queueIndex = 0;
      setTimeout(speakNextSentence, 250);
    } else {
      speaking = false;
      readingAll = false;
      setStatus("停止中");
      renderScript(slides[current].text);
    }
    return;
  }
  renderScript(slides[current].text, queueIndex);
  const u = new SpeechSynthesisUtterance(queue[queueIndex]);
  u.lang = "en-US";
  u.rate = Number($("rate").value);
  u.pitch = 1;
  const v = selectedVoice();
  if (v) u.voice = v;
  u.onend = () => { queueIndex += 1; speakNextSentence(); };
  u.onerror = () => { queueIndex += 1; speakNextSentence(); };
  speechSynthesis.speak(u);
}
function changeSlide(i) {
  saveNow(false);
  speechSynthesis.cancel();
  speaking = false;
  readingAll = false;
  current = Math.max(0, Math.min(slides.length-1, i));
  setStatus("停止中");
  render();
}

$("slideSelect").addEventListener("change", e => changeSlide(Number(e.target.value)));
$("play").addEventListener("click", () => speakCurrent(false));
$("bottomPlay").addEventListener("click", () => speakCurrent(false));
$("all").addEventListener("click", () => speakCurrent(true));
$("pause").addEventListener("click", () => { speechSynthesis.pause(); setStatus("一時停止中"); });
$("resume").addEventListener("click", () => { speechSynthesis.resume(); setStatus("読み上げ中"); });
$("stop").addEventListener("click", stopSpeech);
$("prev").addEventListener("click", () => changeSlide(current-1));
$("next").addEventListener("click", () => changeSlide(current+1));
$("save").addEventListener("click", () => saveNow(true));
$("copy").addEventListener("click", async () => {
  saveNow(false);
  try { await navigator.clipboard.writeText(slides[current].text); toast("コピーしました"); }
  catch(e) { toast("コピーできませんでした"); }
});
$("reset").addEventListener("click", () => {
  if (!confirm("編集内容を消して、初期原稿に戻しますか？")) return;
  slides = structuredClone(DEFAULT_SLIDES);
  localStorage.removeItem(STORAGE_KEY);
  current = 0;
  renderSelect();
  render();
  toast("初期状態に戻しました");
});
$("rate").addEventListener("input", e => $("rateLabel").textContent = Number(e.target.value).toFixed(2));
$("script").addEventListener("input", () => {
  slides[current].text = getPlainText();
  $("words").textContent = wordCount(slides[current].text) + " words";
});

loadSaved();
renderSelect();
render();
if ("speechSynthesis" in window) {
  loadVoices();
  speechSynthesis.onvoiceschanged = loadVoices;
} else {
  setStatus("このブラウザは読み上げ非対応です");
}
</script>
</body>
</html>
